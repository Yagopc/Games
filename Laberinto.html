        let hasAnimatedTiles = false;
        let lastAnimFrame = 0;
        const _spriteWork = [];

        let skyGradient = null;

        const skyBaseCanvas = document.createElement('canvas');
        function buildSkyGradient(halfH) {
            halfH = Math.max(1, halfH | 0);
            skyBaseCanvas.width = 1;
            skyBaseCanvas.height = halfH;
            const sctx = skyBaseCanvas.getContext('2d');
            const img = sctx.createImageData(1, halfH);
            const px = new Uint32Array(img.data.buffer);
            const blendStart = Math.floor(halfH * 0.92);
            const blendLen = Math.max(1, halfH - blendStart);
            for (let y = 0; y < halfH; y++) {
                const t = y / halfH;
                let r = 30 + 200 * Math.pow(t, 2.2);
                let g = 60 + 140 * Math.pow(t, 1.6);
                let b = 140 + 40 * Math.pow(t, 0.8);
                if (y >= blendStart) {
                    const k = (y - blendStart) / blendLen;
                    r = r * (1 - k) + 90 * k;
                    g = g * (1 - k) + 120 * k;
                    b = b * (1 - k) + 160 * k;
                }
                px[y] = 0xFF000000 | (Math.round(b) << 16) | (Math.round(g) << 8) | Math.round(r);
            }
            sctx.putImageData(img, 0, 0);
            skyGradient = px;
        }

        let meltMask = new Uint8Array(1);
        function updateMeltMask() {
            const n = GRID_SIZE * GRID_SIZE;
            if (meltMask.length !== n) meltMask = new Uint8Array(n);
            const cx = GRID_SIZE / 2, cy = GRID_SIZE / 2;
            const maxDist = Math.sqrt(cx * cx + cy * cy);
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const dx = c + 0.5 - cx, dy = r + 0.5 - cy;
                    const norm = 1 - (Math.sqrt(dx * dx + dy * dy) / maxDist);
                    meltMask[r * GRID_SIZE + c] = meltProgress >= (1 - norm) ? 1 : 0;
                }
            }
        }

        function bumpMap() {
            mapVersion++;
            needsRender = true;
        }

        function detectAnimatedTiles() {
            hasAnimatedTiles = false;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const t = map[r][c];
                    if (t === 'A' || t === 'L') { hasAnimatedTiles = true; return; }
                }
            }
        }

        function storeTexture(key, source) {
            tmpTexCtx.clearRect(0, 0, TEX_N, TEX_N);
            tmpTexCtx.drawImage(source, 0, 0, TEX_N, TEX_N);
            const d = tmpTexCtx.getImageData(0, 0, TEX_N, TEX_N);
            const px = new Uint32Array(d.data.buffer);
            for (let i = 0; i < px.length; i++) px[i] |= 0xFF000000;
            texData[key] = px;
            if (key === 'W') {
                const dk = new Uint32Array(px.length);
                for (let i = 0; i < px.length; i++) {
                    const c = px[i];
                    const r = ((c & 0xFF) * 0.6) | 0;
                    const g = (((c >> 8) & 0xFF) * 0.6) | 0;
                    const b = (((c >> 16) & 0xFF) * 0.6) | 0;
                    dk[i] = 0xFF000000 | (b << 16) | (g << 8) | r;
                }
                texData.Wd = dk;
            }
        }

        function sampleTexture(key) {
            const img = textures[key];
            if (!img) return false;
            try {
                storeTexture(key, img);
                return true;
            } catch (e) {
                try { storeTexture(key, createFallbackCanvas(key)); } catch (e2) { return false; }
                return true;
            }
        }

        function ensureFastFloor() {
            if (fastFloor && texData.F && texData.G && texData.A && texData.L && texData.W) return;
            if (!textures.F || !textures.A || !textures.L || !textures.W) return;
            try {
                const okF = sampleTexture('F');
                const okG = sampleTexture('G');
                const okA = sampleTexture('A');
                const okL = sampleTexture('L');
                const okW = sampleTexture('W');
                fastFloor = okF && okG && okA && okL && okW;
            } catch (e) {
                fastFloor = false;
            }
        }

        function setupBuffer() {
            const maxW = 640;
            renderScale = Math.min(1, maxW / canvas.width);
            const bw = Math.max(2, Math.round(canvas.width * renderScale));
            const bh = Math.max(2, Math.round(canvas.height * renderScale));
            bufCanvas.width = bw;
            bufCanvas.height = bh;
            bufCtx = bufCanvas.getContext('2d');
            zBufferArr = new Float32Array(bw);

            frameW = bw; frameH = bh;
            frameImgData = bufCtx.createImageData(bw, bh);
            framePix = new Uint32Array(frameImgData.data.buffer);
            floorY0 = Math.ceil(bh / 2);

            buildSkyGradient(floorY0);
        }

        function resizeCanvas() {
            const viewport = document.getElementById('viewport');
            const rect = viewport.getBoundingClientRect();
            const width = Math.floor(rect.width || window.innerWidth);
            const height = Math.floor(rect.height || window.innerHeight * 0.65);
            canvas.width = width;
            canvas.height = height;
            setupBuffer();
            needsRender = true;
            render();
        }

        function startVictorySequence() {
            if (victoryPhase !== 'none') return;
            isGameOver = true;
            victoryPhase = 'melting';
            meltProgress = 0;
            meltStartTime = performance.now();
            superPrize = null;
            playSound('win');
            document.getElementById('message').innerText = '✨ ¡Todos los tesoros! Las paredes se desvanecen…';
            needsRender = true;
        }

        function isCellMelted(c, r) {
            if (victoryPhase === 'none') return false;
            if (victoryPhase !== 'melting') return true;
            return meltMask[r * GRID_SIZE + c] === 1;
        }

        const cloudSprites = [];
        let sunSprite = null;
        const skyClouds = [];
        const skyBirds = [];
        const _pj = { x: 0, y: 0, k: 0 };

        function initSkyFx() {
            for (let k = 0; k < 3; k++) {
                const w = 256, h = 110;
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const g = c.getContext('2d');
                const n = 7 + k;
                for (let i = 0; i < n; i++) {
                    const t = i / (n - 1);
                    const bump = Math.sin(t * Math.PI);
                    const px = 34 + t * (w - 68) + (Math.random() - 0.5) * 12;
                    const rad = 20 + bump * 22 + Math.random() * 8;
                    const py = h * 0.64 - bump * 14 + (Math.random() - 0.5) * 8;
                    const gr = g.createRadialGradient(px, py, rad * 0.15, px, py, rad);
                    gr.addColorStop(0, 'rgba(255,255,255,0.95)');
                    gr.addColorStop(0.6, 'rgba(255,255,255,0.55)');
                    gr.addColorStop(1, 'rgba(255,255,255,0)');
                    g.fillStyle = gr;
                    g.beginPath(); g.arc(px, py, rad, 0, Math.PI * 2); g.fill();
                }
                g.globalCompositeOperation = 'source-atop';
                const sh = g.createLinearGradient(0, h * 0.4, 0, h);
                sh.addColorStop(0, 'rgba(255,255,255,0)');
                sh.addColorStop(1, 'rgba(150,170,205,0.55)');
                g.fillStyle = sh;
                g.fillRect(0, 0, w, h);
                cloudSprites.push(c);
            }

            sunSprite = document.createElement('canvas');
            sunSprite.width = sunSprite.height = 256;
            const sg = sunSprite.getContext('2d');
            const sgr = sg.createRadialGradient(128, 128, 0, 128, 128, 128);
            sgr.addColorStop(0, 'rgba(255,253,230,1)');
            sgr.addColorStop(0.26, 'rgba(255,244,170,1)');
            sgr.addColorStop(0.32, 'rgba(255,214,90,0.85)');
            sgr.addColorStop(0.5, 'rgba(255,190,60,0.30)');
            sgr.addColorStop(1, 'rgba(255,170,40,0)');
            sg.fillStyle = sgr;
            sg.fillRect(0, 0, 256, 256);

            skyClouds.length = 0;
            for (let i = 0; i < 9; i++) {
                const el = 0.12 + Math.random() * 0.36;
                skyClouds.push({
                    az: (i / 9) * Math.PI * 2 + (Math.random() - 0.5) * 0.4,
                    el: el,
                    size: 0.28 + el * 0.9 + Math.random() * 0.15,
                    speed: 0.01 + Math.random() * 0.02,
                    sprite: i % 3
                });
            }

            skyBirds.length = 0;
            for (let i = 0; i < 6; i++) {
                const flock = i % 2;
                skyBirds.push({
                    flock: flock,
                    dAz: (Math.random() - 0.5) * 0.5,
                    el: 0.17 + Math.random() * 0.26 + flock * 0.05,
                    size: 0.012 + Math.random() * 0.008,
                    phase: Math.random() * 6.28,
                    flap: 7 + Math.random() * 3
                });
            }
        }

        function projectSky(az, el, dir, W, horizon, f) {
            let rel = az - dir;
            rel = Math.atan2(Math.sin(rel), Math.cos(rel));
            if (Math.abs(rel) > 1.15) return false;
            const cr = Math.cos(rel);
            _pj.x = W / 2 + f * Math.tan(rel);
            _pj.y = horizon - f * Math.tan(el) / cr;
            _pj.k = f / cr;
            return true;
        }

        function drawVictorySky(W, H, horizon, planeScale, fx) {
            if (!sunSprite) return;
            const t = globalTime;
            const f = (W / 2) / planeScale;
            const ease = fx * fx * (3 - 2 * fx);

            ctx.save();
            ctx.globalAlpha = ease;

            const minSide = Math.min(W, H);
            const D = minSide * 0.62 * (0.7 + 0.3 * ease);
            const sx = W - minSide * 0.17;
            const sy = minSide * 0.17 + (1 - ease) * minSide * 0.12;
            ctx.drawImage(sunSprite, sx - D / 2, sy - D / 2, D, D);

            const r0 = D * 0.17, r1 = D * 0.30;
            const rot = t * 0.2;
            ctx.fillStyle = 'rgba(255,230,120,0.38)';
            ctx.beginPath();
            for (let i = 0; i < 12; i++) {
                const a = rot + i * (Math.PI / 6);
                const hw = 0.07;
                ctx.moveTo(sx + Math.cos(a - hw) * r0, sy + Math.sin(a - hw) * r0);
                ctx.lineTo(sx + Math.cos(a) * r1, sy + Math.sin(a) * r1);
                ctx.lineTo(sx + Math.cos(a + hw) * r0, sy + Math.sin(a + hw) * r0);
            }
            ctx.fill();

            for (let i = 0; i < skyClouds.length; i++) {
                const c = skyClouds[i];
                if (!projectSky(c.az + t * c.speed, c.el, player.dir, W, horizon, f)) continue;
                const spr = cloudSprites[c.sprite];
                const w = c.size * _pj.k;
                if (w < 4) continue;
                const h = w * spr.height / spr.width;
                if (_pj.x + w / 2 < 0 || _pj.x - w / 2 > W) continue;
                ctx.drawImage(spr, _pj.x - w / 2, _pj.y - h / 2, w, h);
            }

            ctx.strokeStyle = 'rgba(25,30,45,0.92)';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            let drewBird = false;
            for (let i = 0; i < skyBirds.length; i++) {
                const b = skyBirds[i];
                const az = b.flock * Math.PI + t * (b.flock === 0 ? 0.18 : -0.13) + b.dAz;
                const el = b.el + Math.sin(t * 0.7 + b.phase) * 0.03;
                if (!projectSky(az, el, player.dir, W, horizon, f)) continue;
                const s = Math.max(3, b.size * _pj.k);
                const x = _pj.x, y = _pj.y;
                const wy = -s * 0.55 * Math.sin(t * b.flap + b.phase);
                ctx.moveTo(x - s, y + wy);
                ctx.quadraticCurveTo(x - s * 0.5, y - s * 0.35 + wy * 0.3, x, y);
                ctx.quadraticCurveTo(x + s * 0.5, y - s * 0.35 + wy * 0.3, x + s, y + wy);
                drewBird = true;
            }
            if (drewBird) {
                ctx.lineWidth = Math.max(1.3, W * 0.0045);
                ctx.stroke();
            }

            ctx.restore();
        }

        function startNewGameAfterVictory() {
            document.getElementById('victoryOverlay').classList.remove('visible');
            victoryPhase = 'none';
            meltProgress = 0;
            superPrize = null;
            playRandomLevel();
        }

        function exitAfterVictory() {
            document.getElementById('victoryOverlay').classList.remove('visible');
            victoryPhase = 'none';
            meltProgress = 0;
            superPrize = null;
            document.getElementById('message').innerText = 'Partida finalizada. Puedes cerrar esta ventana.';
            document.getElementById('gameNotice').style.display = 'none';
            try { window.close(); } catch (e) {}
            document.body.innerHTML = '<div style="height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#162b42;color:#ffe082;font: bold 1.4rem sans-serif;text-align:center;padding:24px"><div style="font-size:4rem">🏆</div><div>Partida finalizada</div><p style="font-size:1rem;color:#eee">Ya puedes cerrar esta ventana.</p></div>';
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (isEditor) {
                renderEditor2D();
            } else {
                render3dRaycaster();
            }
        }

        function renderEditor2D() {
            const tileSize = Math.floor(Math.min(canvas.width, canvas.height) / GRID_SIZE);
            ctx.save();
            const centerX = canvas.width / 2, centerY = canvas.height / 2;
            ctx.translate(centerX + editorOffsetX, centerY + editorOffsetY);
            ctx.scale(editorZoom, editorZoom);
            ctx.translate(-centerX, -centerY);
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let img = textures.F;
                    const tile = map[r][c];
                    if (tile === 'W') img = textures.W;
                    else if (tile === 'A') img = textures.A;
                    else if (tile === 'L') img = textures.L;
                    else if (tile === 'T') img = textures.T;
                    else if (tile === 'G') img = textures.G;
                    else if (tile === 'Q') img = textures.Q;
                    else if (texCache[tile]) img = texCache[tile];

                    if (img) {
                        if (tile === 'Q') {
                            const pw = tileSize * 0.82;
                            ctx.drawImage(img, c * tileSize + (tileSize-pw)/2, r * tileSize, pw, tileSize);
                        } else {
                            ctx.drawImage(img, c * tileSize, r * tileSize, tileSize, tileSize);
                        }
                    }

                    if (tile === 'P') {
                        const px = c * tileSize + tileSize / 2;
                        const py = r * tileSize + tileSize / 2;
                        ctx.fillStyle = 'rgba(29, 78, 216, 0.85)';
                        ctx.beginPath();
                        ctx.arc(px, py, tileSize * 0.38, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = Math.max(2, tileSize * 0.06);
                        ctx.stroke();
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${Math.max(10, Math.floor(tileSize * 0.55))}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🧍', px, py + 1);
                    }

                    if (tile === 'M') {
                        const key = `${c},${r}`;
                        const num = markIndices[key] || '';
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${Math.max(10, tileSize * 0.45)}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(num, c * tileSize + tileSize / 2, r * tileSize + tileSize / 2);
                    }
                }
            }
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0); ctx.lineTo(i * tileSize, GRID_SIZE * tileSize);
                ctx.moveTo(0, i * tileSize); ctx.lineTo(GRID_SIZE * tileSize, i * tileSize);
                ctx.stroke();
            }
            const px = player.x * tileSize;
            const py = player.y * tileSize;
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(px, py, tileSize * 0.22, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function render3dRaycaster() {
            ensureFastFloor();
            if (fastFloor && hasAnimatedTiles && (globalTime * 1000 - lastAnimTex) > 140) {
                lastAnimTex = globalTime * 1000;
                try { sampleTexture('A'); sampleTexture('L'); } catch (e) { fastFloor = false; }
            }

            const width = frameW;
            const height = frameH;
            const halfH = height / 2;
            const fov = Math.PI / 3;
            const pix = framePix;
            const gs = GRID_SIZE;

            const dirX = Math.cos(player.dir);
            const dirY = Math.sin(player.dir);
            const planeScale = Math.tan(fov / 2);
            const planeX = -dirY * planeScale;
            const planeY = dirX * planeScale;

            const rayDirX0 = dirX - planeX;
            const rayDirY0 = dirY - planeY;
            const rayDirX1 = dirX + planeX;
            const rayDirY1 = dirY + planeY;

            if (victoryPhase === 'melting') updateMeltMask();

            pix.fill(0, 0, floorY0 * width);

            if (fastFloor) {
                const TF = texData.F, TG = texData.G || texData.F, TA = texData.A, TL = texData.L;
                const melting = (victoryPhase !== 'none');
                let idx = floorY0 * width;
                for (let y = floorY0; y < height; y++) {
                    const rowDistance = halfH / (y + 0.5 - halfH);
                    const stepX = rowDistance * (rayDirX1 - rayDirX0) / width;
                    const stepY = rowDistance * (rayDirY1 - rayDirY0) / width;
                    let fx = player.x + rowDistance * rayDirX0;
                    let fy = player.y + rowDistance * rayDirY0;
                    for (let x = 0; x < width; x++) {
                        const cx = Math.floor(fx), cy = Math.floor(fy);
                        let color = 0xFF1a1008;
                        if (cx >= 0 && cx < gs && cy >= 0 && cy < gs) {
                            const tile = map[cy][cx];
                            let tex;
                            if (melting && isCellMelted(cx, cy)) {
                                tex = TF;
                            } else if (tile === 'A') {
                                tex = TA;
                            } else if (tile === 'L') {
                                tex = TL;
                            } else if (tile === 'G') {
                                tex = TG;
                            } else {
                                tex = TF;
                            }
                            const tx = ((fx - cx) * TEX_N) & TEX_MASK;
                            const ty = ((fy - cy) * TEX_N) & TEX_MASK;
                            color = tex[(ty << TEX_SHIFT) | tx];
                        }
                        pix[idx++] = color;
                        fx += stepX;
                        fy += stepY;
                    }
                }
            } else {
                for (let y = floorY0; y < height; y++) {
                    let idx = y * width;
                    for (let x = 0; x < width; x++) pix[idx++] = 0xFFd0b080;
                }
            }

            const TW = texData.W;
            const zBuffer = zBufferArr;
            const meltingWalls = (victoryPhase === 'melting' || victoryPhase === 'superPrize' || victoryPhase === 'done');

            for (let x = 0; x < width; x++) {
                const rayX = rayDirX0 + (rayDirX1 - rayDirX0) * (x / width);
                const rayY = rayDirY0 + (rayDirY1 - rayDirY0) * (x / width);

                let mapX = Math.floor(player.x);
                let mapY = Math.floor(player.y);

                const deltaDistX = Math.abs(1 / (rayX || 1e-30));
                const deltaDistY = Math.abs(1 / (rayY || 1e-30));
                const stepX = rayX < 0 ? -1 : 1;
                const stepY = rayY < 0 ? -1 : 1;
                let sideDistX = rayX < 0 ? (player.x - mapX) * deltaDistX : (mapX + 1.0 - player.x) * deltaDistX;
                let sideDistY = rayY < 0 ? (player.y - mapY) * deltaDistY : (mapY + 1.0 - player.y) * deltaDistY;

                let hit = 0, side = 0;
                while (hit === 0) {
                    if (sideDistX < sideDistY) {
                        sideDistX += deltaDistX; mapX += stepX; side = 0;
                    } else {
                        sideDistY += deltaDistY; mapY += stepY; side = 1;
                    }
                    if (mapX < 0 || mapX >= gs || mapY < 0 || mapY >= gs) { hit = 1; break; }
                    if (map[mapY][mapX] === 'W') {
                        if (meltingWalls && isCellMelted(mapX, mapY)) {
                            // sigue buscando
                        } else {
                            hit = 1;
                        }
                    }
                }

                if (hit === 0 || (mapX < 0 || mapX >= gs || mapY < 0 || mapY >= gs)) {
                    zBuffer[x] = 1e9;
                    continue;
                }

                let perpWallDist = side === 0
                    ? (mapX - player.x + (1 - stepX) / 2) / (rayX || 1e-30)
                    : (mapY - player.y + (1 - stepY) / 2) / (rayY || 1e-30);
                if (perpWallDist <= 0.01) perpWallDist = 0.01;
                zBuffer[x] = perpWallDist;

                const lineHeight = (height / perpWallDist) | 0;
                let drawStart = (-lineHeight / 2 + halfH) | 0;
                let drawEnd = (lineHeight / 2 + halfH) | 0;
                if (drawStart < 0) drawStart = 0;
                if (drawEnd > height) drawEnd = height;

                let wallX = side === 0 ? player.y + perpWallDist * rayY : player.x + perpWallDist * rayX;
                wallX -= Math.floor(wallX);
                let texX = (wallX * TEX_N) & TEX_MASK;
                if ((side === 0 && rayX > 0) || (side === 1 && rayY < 0)) texX = TEX_MASK - texX;

                const invLen = lineHeight > 0 ? TEX_N / lineHeight : 0;
                const texTop = halfH - lineHeight / 2;
                const TWs = (side === 1 && texData.Wd) ? texData.Wd : TW;

                if (TWs) {
                    for (let y = drawStart; y < drawEnd; y++) {
                        const texY = ((y - texTop) * invLen) & TEX_MASK;
                        pix[y * width + x] = TWs[(texY << TEX_SHIFT) | texX];
                    }
                } else {
                    for (let y = drawStart; y < drawEnd; y++) pix[y * width + x] = 0xFFb57428;
                }
            }

            const skyH = Math.ceil(floorY0 * canvas.height / height);
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(skyBaseCanvas, 0, 0, canvas.width, skyH);
            drawVictorySky(canvas.width, canvas.height, skyH, planeScale, 1);

            bufCtx.putImageData(frameImgData, 0, 0);
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(bufCanvas, 0, 0, canvas.width, canvas.height);

            renderSuperPrize(canvas.width, canvas.height, canvas.height / 2, dirX, dirY, planeX, planeY, zBuffer, width);
            renderSprites3D(canvas.width, canvas.height, canvas.height / 2, dirX, dirY, planeX, planeY, zBuffer, width);

            if (showMinimapFlag) drawMinimap();
        }

        function getSprites() {
            if (spriteCacheVersion !== mapVersion) {
                spriteCache = [];
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        const tile = map[r][c];
                        if (tile === 'T' || tile === 'M' || tile === 'Q') {
                            spriteCache.push({ x: c + 0.5, y: r + 0.5, distSq: 0, type: tile, cx: c, cy: r });
                        }
                    }
                }
                spriteCacheVersion = mapVersion;
            }
            return spriteCache;
        }

        function renderSprites3D(width, height, halfH, dirX, dirY, planeX, planeY, zBuffer, bufWidth) {
            const base = getSprites();
            if (base.length === 0) return;

            const px = player.x, py = player.y;
            _spriteWork.length = 0;
            for (let i = 0; i < base.length; i++) {
                const s = base[i];
                const dx = px - s.x, dy = py - s.y;
                _spriteWork.push({ s, distSq: dx * dx + dy * dy });
            }
            _spriteWork.sort((a, b) => b.distSq - a.distSq);

            const invDet = 1.0 / (planeX * dirY - dirX * planeY);
            const bobOffset = Math.sin(globalTime * 4) * 4;
            const zLast = zBuffer.length - 1;
            const scaleX = width / bufWidth;

            for (let i = 0; i < _spriteWork.length; i++) {
                const sp = _spriteWork[i].s;
                const spriteX = sp.x - px;
                const spriteY = sp.y - py;

                const transformX = invDet * (dirY * spriteX - dirX * spriteY);
                const transformY = invDet * (-planeY * spriteX + planeX * spriteY);
                if (transformY <= 0.15) continue;

                const spriteScreenX = Math.floor((width / 2) * (1 + transformX / transformY));
                const spriteSize = Math.abs(Math.floor((height / transformY) * 0.45));
                const drawStartY = Math.floor(halfH + (height / transformY) * 0.12 - spriteSize / 2 + bobOffset / transformY);

                const centerCol = Math.min(zLast, Math.max(0, Math.floor(spriteScreenX / scaleX)));
                if (transformY >= zBuffer[centerCol]) continue;

                const cx = spriteScreenX;
                const cy = drawStartY + spriteSize / 2;
                const rad = Math.max(6, spriteSize * 0.45);

                if (sp.type === 'Q') {
                    const palmW = Math.max(14, spriteSize * 1.4);
                    const palmH = Math.max(20, spriteSize * 2.5);

                    const left = Math.floor(cx - palmW / 2);
                    const groundY = halfH + (height / transformY) * 0.5;
                    const top = Math.floor(groundY - palmH);

                    const leftClamped  = Math.max(0, left);
                    const rightClamped = Math.min(width, Math.ceil(left + palmW));

                    let runStart = -1;
                    for (let sx = leftClamped; sx <= rightClamped; sx++) {
                        let visible = false;
                        if (sx < rightClamped) {
                            const col = Math.min(zLast, Math.max(0, Math.floor(sx / scaleX)));
                            visible = transformY < zBuffer[col];
                        }
                        if (visible && runStart === -1) {
                            runStart = sx;
                        } else if (!visible && runStart !== -1) {
                            const u0 = (runStart - left) / palmW;
                            const u1 = (sx - left) / palmW;
                            const srcX = u0 * textures.Q.width;
                            const srcW = (u1 - u0) * textures.Q.width;
                            if (srcW > 0.5) {
                                ctx.drawImage(
                                    textures.Q,
                                    srcX, 0, srcW, textures.Q.height,
                                    runStart, top, sx - runStart, palmH
                                );
                            }
                            runStart = -1;
                        }
                    }
                } else if (sp.type === 'T') {
                    if (textures.T) {
                        ctx.drawImage(textures.T, cx - rad, cy - rad, rad * 2, rad * 2);
                    } else {
                        ctx.fillStyle = '#facc15';
                        ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
                    }
                } else if (sp.type === 'M') {
                    const key = `${sp.cx},${sp.cy}`;
                    const numStr = String(markIndices[key] || '');
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.beginPath(); ctx.arc(cx, cy - rad * 0.5, rad * 0.85, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#4dd0e1'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${Math.max(14, Math.floor(rad * 0.9))}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(numStr, cx, cy - rad * 0.5);
                }
            }
        }

        function renderSuperPrize(width, height, halfH, dirX, dirY, planeX, planeY, zBuffer, bufWidth) {
            if (!superPrize || superPrize.collected) return;

            const px = player.x, py = player.y;
            const spriteX = superPrize.x - px;
            const spriteY = superPrize.y - py;

            const invDet = 1.0 / (planeX * dirY - dirX * planeY);
            const transformX = invDet * (dirY * spriteX - dirX * spriteY);
            const transformY = invDet * (-planeY * spriteX + planeX * spriteY);
            if (transformY <= 0.15) return;

            const spriteScreenX = Math.floor((width / 2) * (1 + transformX / transformY));
            const spriteSize = Math.abs(Math.floor((height / transformY) * 1.1));
            const bob = Math.sin(globalTime * 3) * 8;
            const drawStartY = Math.floor(halfH + (height / transformY) * 0.1 - spriteSize / 2 + bob / transformY);

            const zLast = zBuffer.length - 1;
            const scaleX = width / bufWidth;
            const centerCol = Math.min(zLast, Math.max(0, Math.floor(spriteScreenX / scaleX)));
            if (transformY < zBuffer[centerCol]) {
                const cx = spriteScreenX;
                const cy = drawStartY + spriteSize / 2;
                const rad = Math.max(20, spriteSize * 0.55);

                const glow = 0.6 + 0.4 * Math.sin(globalTime * 6);
                const grad = ctx.createRadialGradient(cx, cy, rad * 0.2, cx, cy, rad * 1.6);
                grad.addColorStop(0, `rgba(255, 240, 150, ${glow})`);
                grad.addColorStop(1, 'rgba(255, 200, 50, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(cx, cy, rad * 1.6, 0, Math.PI * 2); ctx.fill();

                ctx.font = `${Math.floor(rad * 2)}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff8c0';
                ctx.shadowColor = '#ffcc00';
                ctx.shadowBlur = 20;
                ctx.fillText('★', cx, cy);
                ctx.shadowBlur = 0;
            }
        }

        function buildMinimapCache(mSize, cSize) {
            const side = Math.ceil(mSize);
            minimapCanvas.width = side;
            minimapCanvas.height = side;
            const m = minimapCanvas.getContext('2d');
            m.fillStyle = 'rgba(255, 248, 231, 0.88)';
            m.fillRect(0, 0, mSize, mSize);
            m.strokeStyle = '#78350f'; m.lineWidth = 1.5;
            m.strokeRect(0, 0, mSize, mSize);

            const melting = (victoryPhase !== 'none');

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = map[r][c];
                    const melted = melting && isCellMelted(c, r);
                    let color = null;
                    if (cell === 'W' && !melted) color = '#92400e';
                    else if (cell === 'A' && !melted) color = '#0284c7';
                    else if (cell === 'L' && !melted) color = '#ea580c';
                    else if (cell === 'G') color = '#4d9b43';
                    else if (cell === 'Q') color = '#176b32';
                    else if (cell === 'T') color = '#eab308';
                    else if (cell === 'M') color = '#a1887f';
                    if (color) {
                        m.fillStyle = color;
                        m.fillRect(c * cSize, r * cSize, cSize, cSize);
                    }
                }
            }
        }

        function drawMinimap() {
            const mSize = Math.min(canvas.width, canvas.height) * 0.40;
            const cSize = mSize / GRID_SIZE;
            const key = mSize + '|' + GRID_SIZE + '|' +
                (victoryPhase === 'melting' ? Math.floor(meltProgress * 40) : victoryPhase);
            if (minimapVersion !== mapVersion || minimapKey !== key) {
                buildMinimapCache(mSize, cSize);
                minimapVersion = mapVersion;
                minimapKey = key;
            }
            ctx.drawImage(minimapCanvas, 6, 6);

            const px = 6 + player.x * cSize;
            const py = 6 + player.y * cSize;
            ctx.fillStyle = '#1d4ed8'; ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(px, py);
            ctx.lineTo(px + Math.cos(player.dir) * 7, py + Math.sin(player.dir) * 7); ctx.stroke();
        }

        function toggleMinimap() {
            showMinimapFlag = !showMinimapFlag;
            const btn = document.getElementById('minimapBtn');
            btn.style.opacity = showMinimapFlag ? '1.0' : '0.5';
            document.getElementById('message').innerText = showMinimapFlag ? '🗺️ Mapa de ayuda activado.' : '🗺️ Mapa de ayuda oculto.';
            needsRender = true;
            render();
        }

        function updateStats() {
            const hearts = lives <= 0 ? '💀' : (lives <= 5 ? '❤️'.repeat(lives) : `❤️×${lives}`);
            document.getElementById('livesCount').innerText = hearts;
            document.getElementById('treasureCount').innerText = `${collectedTreasures}/${totalTreasures}`;
            document.getElementById('scoreCount').innerText = score;
            document.getElementById('stepCount').innerText = steps;
            const axeBtn = document.getElementById('axeBtn');
            if (axeBtn) {
                axeBtn.innerText = `🪓 Hacha ×${axes}`;
                axeBtn.disabled = axes <= 0;
            }
            const hammerBtn = document.getElementById('hammerBtn');
            if (hammerBtn) {
                hammerBtn.innerText = `🔨 Martillo ×${hammers}`;
                hammerBtn.disabled = hammers <= 0;
            }
        }

        function getFrontCell() {
            const curX = Math.floor(player.x), curY = Math.floor(player.y);
            const cdx = Math.cos(player.dir), cdy = Math.sin(player.dir);
            for (let t = 0.05; t <= 1.0; t += 0.05) {
                const cx = Math.floor(player.x + cdx * t);
                const cy = Math.floor(player.y + cdy * t);
                if (cx === curX && cy === curY) continue;
                if (cx < 0 || cx >= GRID_SIZE || cy < 0 || cy >= GRID_SIZE) return null;
                return { x: cx, y: cy };
            }
            return null;
        }

        function useAxe() {
            if (isEditor || isGameOver) return;
            initAudio();
            if (axes <= 0) {
                playSound('bump');
                document.getElementById('message').innerText = '🪓 Ya no te quedan hachas.';
                return;
            }
            const f = getFrontCell();
            if (f && map[f.y][f.x] === 'Q') {
                map[f.y][f.x] = 'F';
                axes--;
                bumpMap();
                playSound('chop');
                showCenterNotice('🌴🪓 ¡Palmera talada!', 1400, '#d7ccc8');
                document.getElementById('message').innerText = `🪓 Palmera talada. Te quedan ${axes} hacha${axes === 1 ? '' : 's'}.`;
            } else {
                playSound('bump');
                document.getElementById('message').innerText = '🪓 No hay ninguna palmera justo delante. Acércate y mírala de frente.';
            }
            updateStats();
            needsRender = true;
            render();
        }

        function useHammer() {
            if (isEditor || isGameOver) return;
            initAudio();
            if (hammers <= 0) {
                playSound('bump');
                document.getElementById('message').innerText = '🔨 Ya no te quedan martillos.';
                return;
            }
            const f = getFrontCell();
            if (f && map[f.y][f.x] === 'W') {
                if (f.x === 0 || f.y === 0 || f.x === GRID_SIZE - 1 || f.y === GRID_SIZE - 1) {
                    playSound('bump');
                    document.getElementById('message').innerText = '🔨 El muro exterior es indestructible.';
                } else {
                    map[f.y][f.x] = 'F';
                    hammers--;
                    bumpMap();
                    playSound('smash');
                    showCenterNotice('🧱🔨 ¡Muro derribado!', 1400, '#cfd8dc');
                    document.getElementById('message').innerText = `🔨 Muro derribado. Te quedan ${hammers} martillo${hammers === 1 ? '' : 's'}.`;
                }
            } else {
                playSound('bump');
                document.getElementById('message').innerText = '🔨 No hay ningún muro justo delante. Acércate y míralo de frente.';
            }
            updateStats();
            needsRender = true;
            render();
        }

        function handleInput(dx, dy) {
            if (victoryPhase === 'superPrize') {
                // permitir
            } else if (isEditor || isGameOver) {
                return;
            }
            needsRender = true;

            if (dx === -1) { player.dir -= Math.PI / 6; playSound('step'); render(); needsRender = false; return; }
            if (dx === 1)  { player.dir += Math.PI / 6; playSound('step'); render(); needsRender = false; return; }

            let moveSpeed = dy === -1 ? 0.4 : -0.3;
            let newX = player.x + Math.cos(player.dir) * moveSpeed;
            let newY = player.y + Math.sin(player.dir) * moveSpeed;

            let tileX = Math.floor(newX);
            let tileY = Math.floor(newY);

            const canMove = victoryPhase === 'superPrize'
                ? (tileX >= 0 && tileX < GRID_SIZE && tileY >= 0 && tileY < GRID_SIZE)
                : (tileX >= 0 && tileX < GRID_SIZE && tileY >= 0 && tileY < GRID_SIZE && map[tileY][tileX] !== 'W' && map[tileY][tileX] !== 'Q');

            if (canMove) {
                player.x = newX;
                player.y = newY;
                steps++;
                bumpMap();

                const currentTile = map[tileY][tileX];

                if (victoryPhase === 'superPrize' && superPrize && !superPrize.collected) {
                    const dxp = player.x - superPrize.x;
                    const dyp = player.y - superPrize.y;
                    if (dxp * dxp + dyp * dyp < 0.35 * 0.35) {
                        superPrize.collected = true;
                        victoryPhase = 'done';
                        playSound('treasure');
                        showCenterNotice('🏆 ¡SÚPER PREMIO CONSEGUIDO!', 2500, '#ffe082');
                        setTimeout(() => {
                            document.getElementById('victoryOverlay').classList.add('visible');
                            document.getElementById('message').innerText = '🏆 ¡Victoria total!';
                        }, 900);
                    }
                }

                if (victoryPhase === 'superPrize') {
                    playSound('step');
                } else if (currentTile === 'A') {
                    lives--;
                    playSound('hurt');
                    map[tileY][tileX] = 'F';
                    bumpMap();
                    showCenterNotice('💧 ¡Has perdido una vida!', 2000, '#9be7ff');
                    if (lives <= 0) {
                        lives = 0;
                        isGameOver = true;
                        playSound('gameover');
                        document.getElementById('message').innerText = '💀 Te has quedado sin vidas. Reinicia el nivel.';
                    } else {
                        document.getElementById('message').innerText = `💧 Agua: pierdes una vida. Te quedan ${lives}.`;
                    }
                } else if (currentTile === 'L') {
                    lives = 0;
                    isGameOver = true;
                    playSound('gameover');
                    showCenterNotice('🔥 ¡HAS PERDIDO! La partida se reiniciará…', 1900, '#ff9b59');
                    document.getElementById('message').innerText = '🔥 Has caído en la lava. Volviendo al inicio…';
                    setTimeout(() => {
                        const src = gameLevel;
                        if (src) {
                            initLevel(src, true, editorLivesWanted);
                            document.getElementById('message').innerText = '🔄 Has vuelto a la posición inicial.';
                        }
                    }, 2000);
                } else if (currentTile === 'T') {
                    map[tileY][tileX] = 'F';
                    collectedTreasures++;
                    score += 10;

                    let gainedLife = false;
                    if (collectedTreasures % 2 === 0) {
                        lives++;
                        gainedLife = true;
                        showCenterNotice(`❤️ ¡Has ganado una vida! (${lives})`, 2000, '#b7ffbd');
                    }

                    playSound('treasure');

                    if (collectedTreasures >= totalTreasures) {
                        startVictorySequence();
                    } else {
                        const rem = totalTreasures - collectedTreasures;
                        const extra = gainedLife ? ` ❤️ ¡+1 vida! Ahora tienes ${lives}.` : '';
                        document.getElementById('message').innerText = `✨ ¡Tesoro encontrado! +10 puntos (Faltan ${rem}).${extra}`;
                    }
                } else {
                    playSound('step');
                }
            } else {
                playSound('bump');
            }

            render();
            needsRender = false;
            updateStats();
        }

        function resetLevel() {
            const src = isEditor ? editorLevel : gameLevel;
            if (src) initLevel(src, !isEditor, editorLivesWanted);
        }

        function toggleMode() {
            initAudio();
            isEditor = !isEditor;

            const badge = document.getElementById('modeBadge');
            const panel = document.getElementById('editorPanel');

            if (isEditor) {
                saveGameSnapshot();
                const mx = Math.floor(player.x);
                const my = Math.floor(player.y);
                for (let r = 0; r < GRID_SIZE; r++)
                    for (let c = 0; c < GRID_SIZE; c++)
                        if (map[r][c] === 'P') map[r][c] = 'F';

                let placed = null;
                if (mx >= 0 && mx < GRID_SIZE && my >= 0 && my < GRID_SIZE && map[my][mx] === 'F') {
                    map[my][mx] = 'P';
                    placed = { c: mx, r: my };
                }
                if (!placed) {
                    placed = findNearestFreeCell(mx, my);
                    if (placed) map[placed.r][placed.c] = 'P';
                }
                if (placed) {
                    startPos = { x: placed.c + 0.5, y: placed.r + 0.5 };
                    document.getElementById('message').innerText = `✏️ Editor. Inicio 🧍 en (${placed.c}, ${placed.r}). Toca 🧍 y luego una celda para moverlo.`;
                } else {
                    startPos = { x: player.x, y: player.y };
                    document.getElementById('message').innerText = '✏️ Editor. No hay celdas libres para colocar el inicio.';
                }

                editorLivesWanted = Math.max(3, Math.min(5, lives));
                document.getElementById('livesSelect').value = editorLivesWanted;
                document.getElementById('gridSizeSelect').value = GRID_SIZE;

                if (badge) { badge.innerText = 'Editor 2D'; badge.className = 'mode-badge edit'; }
                panel.classList.add('active');
                bumpMap();
                resizeCanvas();
            } else {
                let hasStart = false;
                for (let r = 0; r < GRID_SIZE; r++)
                    for (let c = 0; c < GRID_SIZE; c++)
                        if (map[r][c] === 'P') hasStart = true;
                if (!hasStart) {
                    const free = findNearestFreeCell(1, 1);
                    if (free) {
                        map[free.r][free.c] = 'P';
                        startPos = { x: free.c + 0.5, y: free.r + 0.5 };
                    }
                }
                saveCurrentAsEditorLevel();
                panel.classList.remove('active');
                if (badge) { badge.innerText = 'Juego 3D'; badge.className = 'mode-badge play'; }

                const restored = restoreGameSnapshot();
                if (!restored) {
                    if (editorLevel) initLevel(editorLevel, true, editorLivesWanted);
                } else {
                    document.getElementById('message').innerText = `☀️ Continuando. Puntos: ${score} · Tesoros: ${collectedTreasures}/${totalTreasures}`;
                }
                bumpMap();
                resizeCanvas();
            }
            updateStats();
            needsRender = true;
        }

        function findNearestFreeCell(fromX, fromY) {
            if (!Number.isFinite(fromX) || !Number.isFinite(fromY)) { fromX = 1; fromY = 1; }
            const sx = Math.max(0, Math.min(GRID_SIZE - 1, Math.round(fromX)));
            const sy = Math.max(0, Math.min(GRID_SIZE - 1, Math.round(fromY)));
            if (map[sy] && map[sy][sx] === 'F') return { c: sx, r: sy };

            const visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
            const queue = [[sx, sy]];
            visited[sy][sx] = true;
            const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
            while (queue.length) {
                const [x, y] = queue.shift();
                if (map[y][x] === 'F') return { c: x, r: y };
                for (const [dx, dy] of dirs) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && !visited[ny][nx]) {
                        visited[ny][nx] = true;
                        queue.push([nx, ny]);
                    }
                }
            }
            return null;
        }

        function selectTool(tool) {
            selectedTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            const toolMap = { W: 'wall', P: 'player', T: 'target', A: 'water', L: 'lava', F: 'floor', G: 'grass', Q: 'palm', M: 'mark' };
            const el = document.getElementById('tool-' + toolMap[tool]);
            if (el) el.classList.add('active');
            if (tool === 'P') {
                const extra = document.getElementById('tool-player-extra');
                if (extra) extra.classList.add('active');
            }
        }

        function changeGridSize(newSize) {
            const newSizeInt = parseInt(newSize, 10);
            if (isNaN(newSizeInt)) return;
            const newMap = Array.from({ length: newSizeInt }, () => Array(newSizeInt).fill('F'));
            for (let r = 0; r < Math.min(GRID_SIZE, newSizeInt); r++) {
                for (let c = 0; c < Math.min(GRID_SIZE, newSizeInt); c++) {
                    if (map[r] && map[r][c]) newMap[r][c] = map[r][c];
                }
            }
            GRID_SIZE = newSizeInt;
            map = newMap;
            invalidateGameSnapshot();
            bumpMap();
            detectAnimatedTiles();
            resizeCanvas(); render(); updateStats();
        }

        function onEditorLivesChange(val) {
            const v = parseInt(val, 10);
            if (!isNaN(v)) editorLivesWanted = Math.max(3, Math.min(5, v));
        }

        function clearEditorGrid() {
            map = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill('F'));
            totalTreasures = 0;
            collectedTreasures = 0;
            markIndices = {};
            markCounter = 0;
            invalidateGameSnapshot();
            detectAnimatedTiles();
            bumpMap();
            render(); updateStats(); playSound('paint');
            document.getElementById('message').innerText = '🧹 Tablero vacío. Coloca el inicio 🧍, muros, hierba, palmeras y tesoros.';
        }

        function toggleEditorZoom() {
            editorZoomEnabled = !editorZoomEnabled;
            const b = document.getElementById('editorZoomToggle');
            b.innerText = editorZoomEnabled ? '🔍 Zoom: ON' : '🔍 Zoom: OFF';
            b.setAttribute('aria-pressed', String(editorZoomEnabled));
            b.classList.toggle('active', editorZoomEnabled);
            editorPointers.clear(); editorGesture = null; render();
        }

        function editorPoint(e) {
            const r = canvas.getBoundingClientRect();
            return {x:(e.clientX-r.left)*canvas.width/r.width, y:(e.clientY-r.top)*canvas.height/r.height};
        }

        function resetEditorGesture() {
            const a = Array.from(editorPointers.values());
            if (a.length >= 2) editorGesture = {type:'pinch', distance:Math.max(1,Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y))};
            else if (a.length === 1) editorGesture = {type:'pan',x:a[0].x,y:a[0].y};
            else editorGesture = null;
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isEditor) return;
            if (editorZoomEnabled) {
                e.preventDefault(); editorPointers.set(e.pointerId, editorPoint(e));
                try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
                resetEditorGesture(); return;
            }
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const tileSize = Math.floor(Math.min(canvas.width, canvas.height) / GRID_SIZE);
            const screenX = (e.clientX - rect.left) * scaleX;
            const screenY = (e.clientY - rect.top) * scaleY;
            const mapX = (screenX - canvas.width / 2 - editorOffsetX) / editorZoom + canvas.width / 2;
            const mapY = (screenY - canvas.height / 2 - editorOffsetY) / editorZoom + canvas.height / 2;
            const cx = Math.floor(mapX / tileSize);
            const cy = Math.floor(mapY / tileSize);
            if (cx < 0 || cx >= GRID_SIZE || cy < 0 || cy >= GRID_SIZE) return;

            if (selectedTool === 'P') {
                for (let r = 0; r < GRID_SIZE; r++)
                    for (let c = 0; c < GRID_SIZE; c++)
                        if (map[r][c] === 'P') map[r][c] = 'F';
                map[cy][cx] = 'P';
                startPos = { x: cx + 0.5, y: cy + 0.5 };
                player = { x: cx + 0.5, y: cy + 0.5, dir: 0 };
                document.getElementById('message').innerText = `🧍 Nuevo inicio en (${cx}, ${cy}). Al volver al 3D empezarás aquí.`;
            } else {
                if (selectedTool === 'M' && map[cy][cx] !== 'M') {
                    markCounter++;
                    markIndices[`${cx},${cy}`] = markCounter;
                } else if (map[cy][cx] === 'M' && selectedTool !== 'M') {
                    delete markIndices[`${cx},${cy}`];
                }
                map[cy][cx] = selectedTool;
            }

            let tCount = 0;
            for (let r = 0; r < GRID_SIZE; r++)
                for (let c = 0; c < GRID_SIZE; c++) if (map[r][c] === 'T') tCount++;
            totalTreasures = tCount;

            bumpMap();
            detectAnimatedTiles();
            playSound('paint'); render(); updateStats();
        }, { passive: false });

        canvas.addEventListener('pointermove', (e) => {
            if (!isEditor || !editorZoomEnabled || !editorPointers.has(e.pointerId)) return;
            e.preventDefault();
            const p = editorPoint(e); editorPointers.set(e.pointerId,p);
            const a = Array.from(editorPointers.values());
            if (a.length >= 2) {
                const dx=a[1].x-a[0].x, dy=a[1].y-a[0].y;
                const dist=Math.max(1,Math.hypot(dx,dy)), mx=(a[0].x+a[1].x)/2, my=(a[0].y+a[1].y)/2;
                if (editorGesture && editorGesture.type==='pinch') {
                    const old=editorZoom, next=Math.max(1,Math.min(5,old*dist/editorGesture.distance));
                    const cx=canvas.width/2, cy=canvas.height/2;
                    const ux=(mx-cx-editorOffsetX)/old+cx, uy=(my-cy-editorOffsetY)/old+cy;
                    editorZoom=next; editorOffsetX=mx-cx-(ux-cx)*next; editorOffsetY=my-cy-(uy-cy)*next;
                }
                editorGesture={type:'pinch',distance:dist};
            } else if (a.length===1) {
                if (editorGesture && editorGesture.type==='pan') { editorOffsetX+=p.x-editorGesture.x; editorOffsetY+=p.y-editorGesture.y; }
                editorGesture={type:'pan',x:p.x,y:p.y};
            }
            render();
        }, {passive:false});

        function endEditorPointer(e) { if (!editorPointers.has(e.pointerId)) return; editorPointers.delete(e.pointerId); resetEditorGesture(); }
        canvas.addEventListener('pointerup',endEditorPointer);
        canvas.addEventListener('pointercancel',endEditorPointer);
        canvas.addEventListener('lostpointercapture',endEditorPointer);

        function placeMark() {
            if (isEditor || isGameOver) return;
            const mx = Math.floor(player.x);
            const my = Math.floor(player.y);
            if (mx >= 0 && mx < GRID_SIZE && my >= 0 && my < GRID_SIZE) {
                const cell = map[my][mx];
                if (cell === 'F' || cell === 'P') {
                    map[my][mx] = 'M';
                    bumpMap();
                    markCounter++;
                    markIndices[`${mx},${my}`] = markCounter;
                    playSound('mark');
                    document.getElementById('message').innerText = `🧱 Marca #${markCounter} colocada.`;
                } else if (cell === 'M') {
                    document.getElementById('message').innerText = '🧱 Ya hay una marca en esta celda.';
                } else {
                    document.getElementById('message').innerText = '🧱 No puedes marcar aquí (tesoro o trampa).';
                }
            }
            needsRender = true;
            render();
        }

        function saveCurrentAsEditorLevel() {
            const levelMap = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill('F'));
            for (let r = 0; r < GRID_SIZE; r++)
                for (let c = 0; c < GRID_SIZE; c++) levelMap[r][c] = map[r][c];
            editorLevel = {
                gridSize: GRID_SIZE, map: levelMap, lives: editorLivesWanted,
                markIndices: JSON.parse(JSON.stringify(markIndices)), markCounter
            };
        }

        function verifyCustomLevel() {
            saveCurrentAsEditorLevel();
            let tCount = 0;
            for (let r = 0; r < GRID_SIZE; r++)
                for (let c = 0; c < GRID_SIZE; c++) if (map[r][c] === 'T') tCount++;
            if (tCount === 0) {
                document.getElementById('message').innerText = '⚠️ Coloca al menos 1 tesoro (T) en el mapa.';
                return false;
            }
            document.getElementById('message').innerText = `✅ Laberinto válido con ${tCount} tesoro(s) y ${editorLivesWanted} vidas.`;
            return true;
        }

        function saveEditorLevel() {
            verifyCustomLevel();
            openMenu(); showSaveDialog();
        }

        function generateRandomLevelData(size) {
            size = size || GRID_SIZE || 12;
            const grid = Array.from({ length: size }, () => Array(size).fill('W'));

            function carve(x, y) {
                grid[y][x] = 'F';
                const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]].sort(() => Math.random() - 0.5);
                for (let [dx, dy] of dirs) {
                    let nx = x + dx, ny = y + dy;
                    if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && grid[ny][nx] === 'W') {
                        grid[y + dy / 2][x + dx / 2] = 'F';
                        carve(nx, ny);
                    }
                }
            }
            carve(1, 1);
            grid[1][1] = 'P';

            const freeCells = [];
            for (let r = 1; r < size - 1; r++) {
                for (let c = 1; c < size - 1; c++) {
                    if (grid[r][c] === 'F' && !(r === 1 && c === 1)) freeCells.push({ r, c });
                }
            }
            freeCells.sort(() => Math.random() - 0.5);

            const numTreasures = size <= 6 ? 2 : (size <= 8 ? 3 : (size <= 12 ? 4 : Math.floor(size * 0.5)));
            for (let i = 0; i < numTreasures && freeCells.length > 0; i++) {
                const cell = freeCells.pop();
                grid[cell.r][cell.c] = 'T';
            }

            const numHazards = size <= 6 ? 1 : (size <= 8 ? 2 : (size <= 12 ? 4 : Math.floor(size * 0.6)));
            let placed = 0;
            for (const cell of freeCells) {
                if (placed >= numHazards) break;
                if (Math.abs(cell.r - 1) + Math.abs(cell.c - 1) <= 2) continue;
                let walls = 0;
                if (grid[cell.r - 1][cell.c] === 'W') walls++;
                if (grid[cell.r + 1][cell.c] === 'W') walls++;
                if (grid[cell.r][cell.c - 1] === 'W') walls++;
                if (grid[cell.r][cell.c + 1] === 'W') walls++;
                if (walls >= 3) {
                    grid[cell.r][cell.c] = placed % 2 === 0 ? 'A' : 'L';
                    placed++;
                }
            }

            return { gridSize: size, map: grid };
        }

        function playRandomLevel() {
            if (isEditor) toggleMode();
            const lvl = generateRandomLevelData(GRID_SIZE);
            initLevel(lvl, true, editorLivesWanted);
            invalidateGameSnapshot();
        }

        function generateRandomLevel() {
            if (!isEditor) toggleMode();
            const size = parseInt(document.getElementById('gridSizeSelect').value, 10) || 24;
            const lvl = generateRandomLevelData(size);
            initLevel(lvl, false, editorLivesWanted);
            saveCurrentAsEditorLevel();
            invalidateGameSnapshot();
            document.getElementById('message').innerText = '🎲 Laberinto con tesoros, agua y lava en el editor.';
        }

        // ============================================================
        //  MENÚ / GUARDADO / SERVIDOR
        // ============================================================
        function openMenu() {
            initAudio(); checkServerHealth();
            document.getElementById('modalOverlay').classList.add('visible');
            showMenuMain();
        }

        function openMenuAndListServer() { openMenu(); listServerGames(); }

        function closeMenu() { document.getElementById('modalOverlay').classList.remove('visible'); }

        function setModal(title, bodyHTML) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
        }

        function showMenuMain() {
            const html = `
                <div class="menu-grid">
                    <div class="menu-card" onclick="closeMenu(); toggleMode()">
                        <span class="icon">👁️</span>
                        <span class="title">${isEditor ? 'Ver en 3D' : 'Editar Mapa'}</span>
                    </div>
                    <div class="menu-card" onclick="closeMenu(); playRandomLevel()">
                        <span class="icon">🎲</span>
                        <span class="title">Nivel al Azar</span>
                    </div>
                    <div class="menu-card" onclick="closeMenu(); resetLevel()">
                        <span class="icon">🔄</span>
                        <span class="title">Reiniciar Nivel</span>
                    </div>
                    <div class="menu-card" onclick="openMenuAndListServer()">
                        <span class="icon">📂</span>
                        <span class="title">Cargar Servidor</span>
                    </div>
                    <div class="menu-card" onclick="showSaveDialog()">
                        <span class="icon">💾</span>
                        <span class="title">Guardar Nivel</span>
                    </div>
                    <div class="menu-card" onclick="listLocalGames()">
                        <span class="icon">📱</span>
                        <span class="title">Cargar Memoria</span>
                    </div>
                    <div class="menu-card" onclick="triggerImportJSON()">
                        <span class="icon">📥</span>
                        <span class="title">Importar JSON</span>
                    </div>
                </div>
                <button class="btn btn-menu" style="width:100%" onclick="exportJSON()">📤 Exportar laberinto.json</button>
                <div id="menuStatus"></div>
            `;
            setModal('Menú de Opciones y Guardado', html);
        }

        function setStatus(msg, type = 'info') {
            const el = document.getElementById('menuStatus');
            if (el) el.innerHTML = `<div class="status-msg ${type}">${msg}</div>`;
        }

        function showSaveDialog() {
            const html = `
                <div style="display:flex; flex-direction:column; gap:6px;">
                    <label style="font-size:0.75rem; font-weight:bold;">Nombre del Laberinto:</label>
                    <input type="text" id="puzzleNameInput" value="Laberinto Solar" style="padding:5px; background:#111; color:#fff; border:1px solid #555; border-radius:4px;">
                    <button class="btn btn-save-edit" onclick="executeSave('server')">💾 Guardar en Servidor</button>
                    <button class="btn btn-reset" onclick="executeSave('local')">📱 Guardar en Memoria Local</button>
                </div>
                <div id="menuStatus"></div>
            `;
            setModal('Guardar Laberinto Creado', html);
        }

        async function executeSave(destination) {
            if (isEditor) saveCurrentAsEditorLevel();
            const name = document.getElementById('puzzleNameInput')?.value || 'Laberinto Solar';
            const levelToSave = isEditor ? editorLevel : (editorLevel || gameLevel);
            if (!levelToSave) { setStatus('No hay nivel para guardar.', 'err'); return; }
            const stateData = {
                type: 'laberinto', title: name, gridSize: levelToSave.gridSize,
                map: levelToSave.map, lives: editorLivesWanted,
                markIndices: levelToSave.markIndices || {},
                markCounter: levelToSave.markCounter || 0
            };

            if (destination === 'server') {
                setStatus('Guardando en el servidor...', 'info');
                try {
                    const res = await fetch(`${SERVER_URL}${SERVER_SAVE_ENDPOINT}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: name, state: stateData })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        setStatus('✅ Guardado con éxito en el servidor.', 'ok');
                        checkServerHealth();
                        return;
                    }
                    throw new Error(data.message || 'Error en servidor');
                } catch(e) {
                    setStatus('⚠️ Error del Servidor. Se guardó copia en Memoria Local.', 'err');
                    saveLocalFallback(stateData);
                }
            } else {
                saveLocalFallback(stateData);
                setStatus('✅ Guardado en Memoria Local.', 'ok');
            }
        }

        function saveLocalFallback(stateData) {
            let saved = [];
            try { saved = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || []; } catch(e){}
            saved.unshift({ id: 'laberinto_' + Date.now(), title: stateData.title, created: new Date().toLocaleString(), level: stateData });
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(saved));
        }

        async function listServerGames() {
            setStatus('Obteniendo laberintos del servidor...', 'info');
            try {
                const res = await fetch(`${SERVER_URL}${SERVER_LIST_ENDPOINT}`);
                if (!res.ok) throw new Error('Error HTTP');
                const data = await res.json();
                const games = extractGamesFromServerData(data);
                if (games.length > 0) { renderGameList(games, 'server'); return; }
                setStatus('No hay partidas guardadas en el servidor.', 'info');
            } catch(e) {
                setStatus('No se pudo conectar al servidor.', 'err');
            }
        }

        function listLocalGames() {
            try {
                const saved = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || [];
                renderGameList(saved, 'local');
            } catch(e) { setStatus('Error al leer memoria local.', 'err'); }
        }

        function renderGameList(games, source) {
            if (!games || games.length === 0) {
                setModal('Partidas Encontradas', '<div style="text-align:center; padding:15px; color:#aaa;">No se encontraron niveles guardados.</div>');
                return;
            }
            let html = '<div class="game-list">';
            games.forEach((g, idx) => {
                const title = g.title || g.name || g.created || `Nivel ${idx + 1}`;
                const id = g.id !== undefined ? g.id : idx;
                const meta = source === 'server'
                    ? `ID: ${id}${g.gridSize ? ' · ' + g.gridSize + 'x' + g.gridSize : ''}`
                    : `ID: ${id}`;
                html += `
                    <div class="game-item">
                        <div>
                            <div class="game-title">${String(title).slice(0,40)}</div>
                            <div class="game-meta">${meta}</div>
                        </div>
                        <div style="display:flex; gap:4px;">
                            <button class="btn-sm load" onclick="loadSelectedGame('${id}', '${source}')">Cargar</button>
                            <button class="btn-sm del" onclick="deleteSelectedGame('${id}', '${source}')">Borrar</button>
                        </div>
                    </div>
                `;
            });
            html += '</div><div id="menuStatus"></div>';
            setModal(`Cargar Laberinto (${source === 'server' ? 'Servidor' : 'Local'})`, html);
        }

        async function loadSelectedGame(id, source) {
            if (source === 'server') {
                let loaded = false;
                try {
                    const res = await fetch(`${SERVER_URL}${SERVER_LOAD_ENDPOINT}?id=${encodeURIComponent(id)}`);
                    if (res.ok) {
                        const data = await res.json();
                        const candidate = data.game?.level || data.game?.state || data.game || data.state || data.level || data;
                        const norm = normalizeLevel(candidate);
                        if (norm) {
                            initLevel(norm, true, norm.lives || editorLivesWanted);
                            invalidateGameSnapshot();
                            loaded = true;
                        }
                    }
                } catch(e) {}
                if (loaded) closeMenu();
                else alert('No se pudo cargar la partida del servidor.');
            } else {
                const saved = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || [];
                const target = saved.find(g => String(g.id) === String(id));
                if (target) {
                    const norm = normalizeLevel(target.level);
                    if (norm) {
                        initLevel(norm, true, norm.lives || editorLivesWanted);
                        invalidateGameSnapshot();
                        closeMenu();
                    }
                }
            }
        }

        async function deleteSelectedGame(id, source) {
            if (source === 'server') {
                try {
                    const res = await fetch(`${SERVER_URL}${SERVER_DEL_ENDPOINT}?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) listServerGames();
                } catch(e) { alert('No se pudo borrar del servidor.'); }
            } else {
                let saved = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || [];
                saved = saved.filter(g => String(g.id) !== String(id));
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(saved));
                listLocalGames();
            }
        }

        function triggerImportJSON() { document.getElementById('fileInput').click(); }

        function exportJSON() {
            if (isEditor) saveCurrentAsEditorLevel();
            const lvl = isEditor ? editorLevel : (editorLevel || gameLevel);
            if (!lvl) { alert('No hay nivel para exportar.'); return; }
            const exportObj = {
                games: [{
                    id: 'laberinto_' + Date.now(),
                    title: lvl.title || 'Laberinto Solar',
                    created: new Date().toLocaleString(),
                    level: {
                        type: 'laberinto', title: lvl.title || 'Laberinto Solar',
                        gridSize: lvl.gridSize, map: lvl.map, lives: editorLivesWanted,
                        markIndices: lvl.markIndices || {}, markCounter: lvl.markCounter || 0
                    }
                }]
            };
            const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'laberinto.json'; a.click();
            URL.revokeObjectURL(url);
        }

        function importJSON(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    let gamesList = data.games || (Array.isArray(data) ? data : [{ title: data.title || 'Importado', level: data }]);
                    let savedLocal = [];
                    try { savedLocal = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || []; } catch(err){}
                    gamesList.forEach((g, idx) => {
                        savedLocal.unshift({
                            id: g.id || 'imported_' + Date.now() + '_' + idx,
                            title: g.title || (g.level && g.level.title) || `Laberinto ${idx + 1}`,
                            created: g.created || new Date().toLocaleString(),
                            level: g.level || g
                        });
                    });
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(savedLocal));
                    if (gamesList.length > 0) {
                        const firstNorm = normalizeLevel(gamesList[0].level || gamesList[0]);
                        if (firstNorm) {
                            initLevel(firstNorm, true, firstNorm.lives || editorLivesWanted);
                            invalidateGameSnapshot();
                            closeMenu();
                        }
                    }
                } catch(err) { alert('Archivo JSON no válido'); }
            };
            reader.readAsText(file);
        }

        window.addEventListener('keydown', (e) => {
            if (isEditor) return;
            if (e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); handleInput(0, -1); }
            if (e.key === 'ArrowDown' || e.key === 's') { e.preventDefault(); handleInput(0, 1); }
            if (e.key === 'ArrowLeft' || e.key === 'a') { e.preventDefault(); handleInput(-1, 0); }
            if (e.key === 'ArrowRight' || e.key === 'd') { e.preventDefault(); handleInput(1, 0); }
            if (e.key === 'h' || e.key === 'H' || e.key === 'e' || e.key === 'E') { e.preventDefault(); useAxe(); }
            if (e.key === 'm' || e.key === 'M') { e.preventDefault(); useHammer(); }
        });

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 250));

        let lastFrameTime = 0;
        let lastSkyFrame = 0;

        function animateLoop(now) {
            requestAnimationFrame(animateLoop);
            if (now - lastFrameTime < 28) return;
            lastFrameTime = now;
            globalTime = now * 0.001;

            if (victoryPhase === 'melting') {
                const elapsed = now - meltStartTime;
                meltProgress = Math.min(1, elapsed / MELT_DURATION);
                needsRender = true;
                if (meltProgress >= 1) {
                    victoryPhase = 'superPrize';
                    superPrize = { x: GRID_SIZE / 2, y: GRID_SIZE / 2, collected: false };
                    document.getElementById('message').innerText = '🌟 ¡Ha aparecido el Súper Premio en el centro! Ve a por él.';
                }
            }

            if (isEditor || document.hidden) return;

            if (now - lastSkyFrame > 55) { lastSkyFrame = now; needsRender = true; }

            if (hasAnimatedTiles && now - lastAnimFrame > 140) {
                lastAnimFrame = now;
                needsRender = true;
            }

            if (needsRender || victoryPhase !== 'none') {
                render();
                needsRender = false;
            }
        }

        window.onload = () => {
            initSkyFx();
            loadImages(() => {
                createExtraTextures();
                const randomLevel = generateRandomLevelData(24);
                initLevel(randomLevel, true, 3);
                editorLevel = JSON.parse(JSON.stringify(randomLevel));
                editorLevel.lives = 3;
                checkServerHealth();
                setTimeout(resizeCanvas, 50);
                requestAnimationFrame(animateLoop);
            });
        };
    </script>
