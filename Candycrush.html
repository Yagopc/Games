<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Candy Crush — Retos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-alpha.6/css/bootstrap.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/2.4.2/seedrandom.js"></script>

  <!-- ================= CSS ================= -->
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: 'Trebuchet MS', sans-serif;
      font-weight: bold;
      text-align: center;
      color: #fff;
      background:
        linear-gradient(rgba(20,0,40,.55), rgba(0,0,0,.65)),
        url("fondo.png") center/cover no-repeat,
        radial-gradient(circle at 50% 0%, #6a2c91 0%, #2b0a3d 60%, #120018 100%);
      background-attachment: fixed;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(4px, 1vh, 12px);
      gap: clamp(4px, 1vh, 10px);
    }

    /* ---------- FILA 1: HUD superior ---------- */
    #topBar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: nowrap;
    }

    #gameTitle {
      font-size: clamp(1rem, 2.4vh, 1.8rem);
      font-weight: 900;
      color: #ffd54f;
      text-shadow: 0 0 10px #ff6d00, 0 0 22px #ff3d00, 0 2px 0 #000;
      letter-spacing: 1px;
      margin: 0;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #scoreWrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 0;
    }

    #scoreLabel {
      display: inline-block;
      font-size: clamp(1.2rem, 3.2vh, 2rem);
      font-weight: 900;
      letter-spacing: 1px;
      padding: clamp(2px, .6vh, 8px) clamp(10px, 2.5vh, 22px);
      border-radius: 14px;
      background: linear-gradient(180deg, #ffe066, #ffb300);
      color: #4a1a00;
      text-shadow: 0 2px 0 #fff6;
      box-shadow: 0 4px 0 #a86b00, 0 6px 14px #0008;
      transition: transform .15s ease, box-shadow .15s ease;
      min-width: 5em;
    }
    #scoreLabel.bump {
      transform: translateY(-3px) scale(1.08);
      box-shadow: 0 1px 0 #a86b00, 0 10px 20px #000a;
    }

    #comboLabel {
      font-size: clamp(.7rem, 1.6vh, 1rem);
      color: #ffd54f;
      text-shadow: 0 0 8px #ff8f00, 0 0 18px #ff6d00;
      opacity: 0;
      transition: opacity .2s;
      height: 1.1em;
      line-height: 1.1em;
    }
    #comboLabel.show { opacity: 1; animation: pulse 0.6s ease; }
    @keyframes pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    #movesBox {
      font-size: clamp(.75rem, 1.8vh, 1rem);
      color: #fff;
      text-shadow: 0 0 6px #ff6d00;
      background: rgba(0,0,0,.35);
      padding: 4px 10px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #movesBox b { color: #ffd54f; font-size: 1.2em; }

    /* ---------- Retos / objetivos ---------- */
    #challengeBar {
      width: 100%;
      max-width: 560px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(4px, 1.5vw, 14px);
      flex-wrap: wrap;
      font-size: clamp(.62rem, 1.4vh, .9rem);
      color: #ffe082;
      text-shadow: 0 0 6px #000, 0 1px 0 #000;
      background: rgba(0,0,0,.35);
      border-radius: 12px;
      padding: clamp(2px, .5vh, 6px) clamp(6px, 1.5vw, 14px);
      border: 1px solid rgba(255,213,79,.35);
    }

    .challenge-item {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .challenge-item .ch-target {
      color: #fff;
      background: rgba(255,255,255,.15);
      border-radius: 6px;
      padding: 1px 6px;
    }

    .challenge-item.done .ch-target {
      background: #4caf50;
      color: #fff;
      text-shadow: none;
    }

    #levelBadge {
      font-size: clamp(.7rem, 1.6vh, 1rem);
      font-weight: 900;
      color: #fff;
      background: linear-gradient(180deg, #7c4dff, #4527a0);
      padding: clamp(2px, .5vh, 6px) clamp(8px, 2vw, 16px);
      border-radius: 20px;
      box-shadow: 0 0 14px #7c4dff99, 0 2px 0 #311b92;
      white-space: nowrap;
    }

    #timerBox {
      font-size: clamp(.65rem, 1.5vh, .9rem);
      color: #fff;
      background: rgba(0,0,0,.4);
      border-radius: 10px;
      padding: 2px 10px;
      white-space: nowrap;
    }
    #timerBox.warn { color: #ff5252; animation: blink 0.8s infinite alternate; }
    @keyframes blink { from { opacity: 1; } to { opacity: .45; } }

    #starsBox {
      font-size: clamp(.85rem, 2vh, 1.2rem);
      letter-spacing: 2px;
      filter: drop-shadow(0 0 6px #ffb300);
      white-space: nowrap;
    }

    /* ---------- FILA 2: canvas ---------- */
    #boardWrap {
      position: relative;
      flex: 0 0 auto;
      --board: min(92vw, calc(100vh - 300px), 520px);
      width: var(--board);
      height: var(--board);
      border-radius: 16px;
      background: rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.15), 0 10px 30px #0008;
    }

    #gameBoard, #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #gameBoard { z-index: 1; }
    #canvas {
      z-index: 10;
      opacity: .7;
      pointer-events: auto;
      touch-action: none;
    }

    img { position: absolute; }

    /* ---------- FILA 3: botonera horizontal ---------- */
    #bottomBar {
      width: 100%;
      max-width: 560px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(3px, .8vw, 8px);
      flex-wrap: nowrap;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: clamp(3px, .9vh, 8px) clamp(5px, 1.2vw, 12px);
      font-size: clamp(.62rem, 1.5vh, .9rem);
      font-weight: 800;
      color: #2a0a3d;
      background: linear-gradient(180deg, #e0e0e0, #bdbdbd);
      box-shadow: 0 3px 0 #7a7a7a, 0 4px 10px #0006;
      transition: transform .08s, box-shadow .08s;
      white-space: nowrap;
      flex: 0 1 auto;
      min-width: 0;
    }
    .btn:hover  { background: linear-gradient(180deg, #f2f2f2, #cfcfcf); }
    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a7a7a; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .btn-power {
      background: linear-gradient(180deg, #b388ff, #7c4dff);
      color: #fff;
      text-shadow: 0 1px 0 #0006;
      box-shadow: 0 3px 0 #4527a0, 0 4px 10px #0006;
      position: relative;
    }
    .btn-power .badge-count {
      position: absolute;
      top: -6px; right: -6px;
      background: #ff1744;
      color: #fff;
      border-radius: 50%;
      font-size: clamp(.55rem, 1.2vh, .7rem);
      width: clamp(16px, 2.2vh, 22px);
      height: clamp(16px, 2.2vh, 22px);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 8px #ff1744;
    }
    .btn-power.active {
      outline: 2px solid #ffeb3b;
      animation: glow 1s infinite alternate;
    }
    @keyframes glow {
      from { box-shadow: 0 0 8px #ffeb3b; }
      to   { box-shadow: 0 0 18px #ffeb3b, 0 0 26px #ff9800; }
    }

    /* Texto flotante +1 */
    .float-score {
      position: fixed;
      z-index: 50;
      font-size: clamp(.9rem, 2.2vh, 1.4rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 6px #ff0, 0 0 14px #f90, 0 2px 2px #000;
      pointer-events: none;
      animation: floatUp 0.9s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0)    scale(.7); opacity: 0; }
      20%  { opacity: 1; }
      100% { transform: translateY(-60px) scale(1.25); opacity: 0; }
    }

    body.hammer-mode #canvas { cursor: crosshair; }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 6vh;
      transform: translateX(-50%) translateY(20px);
      background: #311b92;
      color: #fff;
      padding: clamp(6px, 1.2vh, 12px) clamp(12px, 3vw, 22px);
      border-radius: 30px;
      font-size: clamp(.75rem, 1.6vh, 1rem);
      opacity: 0;
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      box-shadow: 0 8px 24px #000a;
      z-index: 999;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-height: 520px) {
      #boardWrap { --board: min(70vh, 60vw); }
      #gameTitle { display: none; }
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- ===== FILA 1: HUD superior ===== -->
    <div id="topBar">
      <h1 id="gameTitle">Candy Crush</h1>
      <div id="scoreWrap">
        <label id="scoreLabel">0</label>
        <div id="comboLabel"></div>
      </div>
      <div id="movesBox">Movs: <b id="movesCount">30</b></div>
    </div>

    <!-- ===== RETOS / OBJETIVOS ===== -->
    <div id="challengeBar">
      <span id="levelBadge">Nivel 1</span>
      <div class="challenge-item" id="chScore">
        <span>🎯 Puntos:</span><span class="ch-target">0 / 1000</span>
      </div>
      <div class="challenge-item" id="chRed">
        <span>🔴 Rojos:</span><span class="ch-target">0 / 10</span>
      </div>
      <div class="challenge-item" id="chCombo">
        <span>🔥 Combo x3:</span><span class="ch-target">0 / 3</span>
      </div>
      <div id="starsBox">☆☆☆</div>
      <div id="timerBox">⏱️ 120s</div>
    </div>

    <!-- ===== FILA 2: tablero ===== -->
    <div id="boardWrap">
      <div id="gameBoard"></div>
      <canvas id="canvas">
        <p>Canvas not supported on your browser.</p>
      </canvas>
    </div>

    <!-- ===== FILA 3: botonera horizontal ===== -->
    <div id="bottomBar">
      <input class="btn" type="button" id="newGame"  value="🎮 New">
      <input class="btn" type="button" id="showMove" value="💡 Pista">

      <button class="btn btn-power" id="btnHammer" title="Rompe un caramelo">
        🔨 <span class="badge-count" id="hammerCount">3</span>
      </button>
      <button class="btn btn-power" id="btnShuffle" title="Mezcla el tablero">
        🔀 <span class="badge-count" id="shuffleCount">2</span>
      </button>
      <button class="btn btn-power" id="btnExtra" title="+5 movimientos">
        ⏱️+5 <span class="badge-count" id="extraCount">1</span>
      </button>
      <button class="btn btn-power" id="btnSound" title="Sonido">🔊</button>
    </div>

  </div>

  <div id="toast"></div>

  <!-- ============================================================
       JS del motor (candy, board, rules, handler)
       ============================================================ -->
  <script>
  /* 1) candy.js */
  var Candy = function(color, id)
  {
    Object.defineProperty(this, 'color', {value: color, writable: false});
    Object.defineProperty(this, 'id', {value: id, writable: false});
    this.row = null;
    this.col = null;
    this.toString = function(){ return this.color; }
  };
  Candy.colors = ['red','yellow','green','orange','blue','purple'];

  /* 2) board.js */
  var Board = function(size)
  {
    var candyCounter = 0;
    this.score = 0;
    this.boardSize = size;
    this.square = new Array(this.boardSize);
    for (var i = 0; i <= this.boardSize; i++) this.square[i] = [];

    this.isValidLocation = function(row, col){
      return (row >= 0 && col >= 0 && row <= this.boardSize && col <= this.boardSize &&
              row == Math.round(row) && col == Math.round(col));
    }
    this.isEmptyLocation = function(row, col){
      return !this.getCandyAt(row, col);
    }
    this.doAutoMove = function(){
      var move = rules.getRandomValidMove();
      var toCandy = board.getCandyInDirection(move.candy, move.direction);
      this.flipCandies(move.candy, toCandy);
    }
    this.getSize = function(){ return this.boardSize; }
    this.getCandyAt = function(row, col){
      if (this.isValidLocation(row,col)) return this.square[row][col];
    }
    this.getLocationOf = function(candy){ return {row:candy.row, col:candy.col}; }
    this.getAllCandies = function(){
      var results = [];
      for (var r in this.square) for (var c in this.square[r])
        if (this.square[r][c]) results.push(this.square[r][c]);
      return results;
    }
    this.add = function(candy, row, col, spawnRow, spawnCol){
      if (this.isEmptyLocation(row, col)){
        var details = {candy:candy, toRow:row, toCol:col, fromRow:spawnRow, fromCol:spawnCol};
        candy.row = row; candy.col = col;
        this.square[row][col] = candy;
        $(this).triggerHandler("add", details);
      } else console.log("add already found a candy at " + row + "," + col);
    }
    this.moveTo = function(candy, toRow, toCol){
      if (this.isEmptyLocation(toRow,toCol)){
        var details = {candy:candy, toRow:toRow, toCol:toCol, fromRow:candy.row, fromCol:candy.col};
        delete this.square[candy.row][candy.col];
        this.square[toRow][toCol] = candy;
        candy.row = toRow; candy.col = toCol;
        $(this).triggerHandler("move", details);
      }
    }
    this.remove = function(candy){
      var details = {candy:candy, fromRow:candy.row, fromCol:candy.col};
      delete this.square[candy.row][candy.col];
      candy.row = candy.col = null;
      $(this).triggerHandler("remove", details);
    }
    this.removeAt = function(row, col){
      if (this.isEmptyLocation(row, col)) console.log("removeAt found no candy at " + row + "," + col);
      else this.remove(this.square[row][col]);
    }
    this.clear = function(){
      for (var r in this.square) for (var c in this.square[r])
        if (this.square[r][c]) this.removeAt(r, c);
    }
    this.addCandy = function(color, row, col, spawnRow, spawnCol){
      var candy = new Candy(color, candyCounter++);
      this.add(candy, row, col, spawnRow, spawnCol);
    }
    this.addRandomCandy = function(row, col, spawnRow, spawnCol){
      var random_color = Math.floor(Math.random() * Candy.colors.length);
      var candy = new Candy(Candy.colors[random_color], candyCounter++);
      this.add(candy, row, col, spawnRow, spawnCol);
    }
    this.getCandyInDirection = function(fromCandy, direction){
      switch(direction){
        case "up":    return this.getCandyAt(fromCandy.row-1, fromCandy.col);
        case "down":  return this.getCandyAt(fromCandy.row+1, fromCandy.col);
        case "left":  return this.getCandyAt(fromCandy.row, fromCandy.col-1);
        case "right": return this.getCandyAt(fromCandy.row, fromCandy.col+1);
      }
    }
    this.flipCandies = function(candy1, candy2){
      var d1 = {candy:candy1, toRow:candy2.row, toCol:candy2.col, fromRow:candy1.row, fromCol:candy1.col};
      var d2 = {candy:candy2, toRow:candy1.row, toCol:candy1.col, fromRow:candy2.row, fromCol:candy2.col};
      candy1.row = d1.toRow; candy1.col = d1.toCol;
      this.square[d1.toRow][d1.toCol] = candy1;
      candy2.row = d2.toRow; candy2.col = d2.toCol;
      this.square[d2.toRow][d2.toCol] = candy2;
      $(this).triggerHandler("move", d1);
      $(this).triggerHandler("move", d2);
    }
    this.resetScore = function(){
      this.score = 0;
      $(this).triggerHandler("scoreUpdate", [{score: 0}]);
    }
    this.incrementScore = function(candy, row, col){
      this.score += 5;
      $(this).triggerHandler("scoreUpdate", [{score:this.score, candy:candy, row:row, col:col}]);
    }
    this.getScore = function(){ return this.score; }
    this.toString = function(){
      var result = "";
      for (var r = 0; r < this.boardSize; ++r){
        for (var c = 0; c < this.boardSize; ++c){
          var candy = this.square[r][c];
          result += candy ? candy.toString().charAt(0) + " " : "_ ";
        }
        result += "<br/>";
      }
      return result.toString();
    }
  }

  /* 3) rules.js */
  var Rules = function(board)
  {
    var scoring = false;

    this.prepareNewGame = function(){
      scoring = false;
      while (true){
        this.populateBoard()
        var crushable = this.getCandyCrushes();
        if (crushable.length == 0) break;
        this.removeCrushes(crushable);
      }
      scoring = true;
    }
    this.isMoveTypeValid = function(fromCandy, direction){
      return this.numberCandiesCrushedByMove(fromCandy, direction) > 0;
    }
    this.getCandyCrushes = function(swap){
      var unioned = {}, sizes = {}, row, col;
      function find(key){ var p = unioned[key]; if (p == null) return key; p = find(p); unioned[key] = p; return p; }
      function size(f){ return sizes[f] || 1; }
      function union(k1, k2){ var p1 = find(k1), p2 = find(k2); if (p1 == p2) return p1; unioned[p2] = p1; sizes[p1] = size(p1)+size(p2); delete sizes[p2]; }
      var vert = this.findColorStrips(true, swap);
      var horiz = this.findColorStrips(false, swap);
      var sets = vert.concat(horiz);
      for (var j = 0; j < sets.length; j++){ var set = sets[j]; for (var k = 1; k < set.length; k++) union(set[0].id, set[k].id); }
      var results = {};
      for (row = 0; row < board.boardSize; row++){
        for (col = 0; col < board.boardSize; col++){
          var candy = board.getCandyAt(row, col);
          if (candy){ var p = find(candy.id); if (size(p) >= 3){ if (!(p in results)) results[p] = []; results[p].push(candy); } }
        }
      }
      var list = [];
      for (var key in results) list.push(results[key]);
      return list;
    }
    this.removeCrushes = function(setOfSetsOfCrushes){
      for (var j = 0; j < setOfSetsOfCrushes.length; j++){
        var set = setOfSetsOfCrushes[j];
        for (var k = 0; k < set.length; k++){
          if (scoring) board.incrementScore(set[k], set[k].row, set[k].col);
          board.remove(set[k]);
        }
      }
    }
    this.moveCandiesDown = function(){
      for (var col = 0; col < board.boardSize; col++){
        var emptyRow = null;
        for (var emptyRow = board.boardSize - 1; emptyRow >= 0; emptyRow--)
          if (board.getCandyAt(emptyRow, col) == null) break;
        for (var row = emptyRow - 1; row >= 0; row--){
          var candy = board.getCandyAt(row, col);
          if (candy != null){ board.moveTo(candy, emptyRow, col); emptyRow--; }
        }
        for (var spawnRow = -1; emptyRow >= 0; emptyRow--, spawnRow--)
          board.addRandomCandy(emptyRow, col, spawnRow, col);
      }
    }
    this.getRandomValidMove = function(){
      var directions = ['up','down','left','right'];
      var validMovesThreeCrush = [];
      var validMovesMoreThanThreeCrush = [];
      for (var row = 0; row < board.boardSize; row++){
        for (var col = 0; col < board.boardSize; col++){
          var fromCandy = board.getCandyAt(row,col);
          if (!fromCandy) continue;
          for (var i = 0; i < 4; i++){
            var direction = directions[i];
            var n = this.numberCandiesCrushedByMove(fromCandy, direction);
            if (n == 3) validMovesThreeCrush.push({candy:fromCandy, direction:direction});
            else if (n > 3) validMovesMoreThanThreeCrush.push({candy:fromCandy, direction:direction});
          }
        }
      }
      var searchArray = validMovesThreeCrush.length ? validMovesThreeCrush : validMovesMoreThanThreeCrush;
      if (searchArray.length == 0) return null;
      return searchArray[Math.floor(Math.random() * searchArray.length)];
    }
    this.createSpecifiedBoard = function(boardSpec){
      var color_dict = {'r':'red','o':'orange','y':'yellow','g':'green','b':'blue','p':'purple'};
      var numChars = 0;
      boardSpec.map(function(i){ return numChars += i.length });
      if (boardSpec.length != board.boardSize || numChars != Math.pow(board.boardSize,2)){
        console.warn("boardSpec must be of dimensions boardSize x boardSize to populate board"); return;
      }
      for (var col = 0; col < board.boardSize; col++)
        for (var row = 0; row < board.boardSize; row++)
          if (board.getCandyAt(row, col) == null){
            var color = color_dict[boardSpec[row].charAt(col)];
            board.addCandy(color, row, col);
          }
    }
    this.populateBoard = function(){
      for (var col = 0; col < board.boardSize; col++)
        for (var row = 0; row < board.boardSize; row++)
          if (board.getCandyAt(row, col) == null) board.addRandomCandy(row, col);
    }
    this.numberCandiesCrushedByMove = function(fromCandy, direction){
      return this.getCandiesToCrushGivenMove(fromCandy, direction).length;
    }
    this.getCandiesToCrushGivenMove = function(fromCandy, direction){
      var toCandy = board.getCandyInDirection(fromCandy, direction);
      if (!toCandy || toCandy.color == fromCandy.color) return [];
      var swap = [fromCandy, toCandy];
      var crushable = this.getCandyCrushes(swap);
      var connected = crushable.filter(function(set){
        for (var k = 0; k < swap.length; k++) if (set.indexOf(swap[k]) >= 0) return true;
        return false;
      });
      return [].concat.apply([], connected);
    }
    this.findColorStrips = function(vertical, swap){
      var getAt = function(x, y){
        var result = vertical ? board.getCandyAt(y, x) : board.getCandyAt(x, y);
        if (swap){ var index = swap.indexOf(result); if (index >= 0) return swap[index ^ 1]; }
        return result;
      };
      var result = [];
      for (var j = 0; j < board.boardSize; j++){
        for (var h, k = 0; k < board.boardSize; k = h){
          var firstCandy = getAt(j, k);
          h = k + 1;
          if (!firstCandy) continue;
          var candies = [firstCandy];
          for (; h < board.boardSize; h++){
            var lastCandy = getAt(j, h);
            if (!lastCandy || lastCandy.color != firstCandy.color) break;
            candies.push(lastCandy);
          }
          if (candies.length >= 3) result.push(candies);
        }
      }
      return result;
    }
  }

  function DrawArrow(){
    var validMove = rules.getRandomValidMove();
    if (!validMove) return;
    var canvas = document.getElementById("canvas");
    var ctx = canvas.getContext('2d');
    var size = canvas.width;
    ctx.clearRect(0,0,size,size);
    var col = validMove.candy.col, row = validMove.candy.row;
    var candySize = size/board.boardSize;
    var squareSize = candySize/2;
    var x = (col+1) * candySize - squareSize;
    var y = (row+1) * candySize - squareSize;
    ctx.fillStyle = "#333333";
    ctx.beginPath();
    if(validMove.direction == "up"){
      ctx.fillRect(x - (squareSize / 2), y - squareSize, squareSize, squareSize);
      ctx.moveTo(x - squareSize, y - squareSize + 1);
      ctx.lineTo(x, y - (2 * squareSize));
      ctx.lineTo(x + squareSize, y - squareSize + 1);
    } else if(validMove.direction == "down"){
      ctx.fillRect(x - (squareSize / 2), y, squareSize, squareSize);
      ctx.moveTo(x + squareSize, y + squareSize - 1);
      ctx.lineTo(x, y + squareSize + squareSize);
      ctx.lineTo(x - squareSize, y + squareSize - 1);
    } else if(validMove.direction == "left"){
      ctx.fillRect(x - squareSize, y - (squareSize / 2), squareSize, squareSize);
      ctx.moveTo(x - squareSize + 1, y - squareSize);
      ctx.lineTo(x - (2 * squareSize), y);
      ctx.lineTo(x - squareSize + 1, y + squareSize);
    } else if(validMove.direction == "right"){
      ctx.fillRect(x, y - (squareSize / 2), squareSize, squareSize);
      ctx.moveTo(x + squareSize - 1, y + squareSize);
      ctx.lineTo(x + (2 * squareSize), y);
      ctx.lineTo(x + squareSize - 1, y - squareSize);
    }
    ctx.closePath();
    ctx.fill();
  }

  function ClearCanvas(){
    var canvas = document.getElementById("canvas");

    ctx.clearRect(0,0,canvas.width,canvas.height);

  <script>
  /* =====================================================
     1) SoundFX — sonidos sintetizados (Web Audio API)
     ===================================================== */
  var SoundFX = (function(){
    var enabled = true;
    var ctx = null;

    function ensureCtx(){
      if (!ctx){
        try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e){ console.warn("WebAudio no disponible", e); }
      }
      if (ctx && ctx.state === "suspended") ctx.resume();
      return ctx;
    }

    function tone(freq, duration, type, gainPeak, slideTo){
      if (!enabled) return;
      var c = ensureCtx(); if (!c) return;
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, c.currentTime);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + duration);
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(gainPeak || 0.15, c.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + duration);
      o.connect(g).connect(c.destination);
      o.start();
      o.stop(c.currentTime + duration + 0.02);
    }

    return {
      isEnabled: function(){ return enabled; },
      toggle: function(){
        enabled = !enabled;
        if (enabled) tone(660, 0.08, "sine", 0.12);
        return enabled;
      },
      swap:  function(){ tone(520, 0.07, "triangle", 0.10); },
      crush: function(count){
        var base = 440;
        var steps = Math.min(count, 4);
        for (var i = 0; i < steps; i++){
          (function(i){
            setTimeout(function(){
              tone(base * Math.pow(1.26, i), 0.18, "square", 0.08, base * Math.pow(1.26, i) * 1.5);
            }, i * 55);
          })(i);
        }
      },
      powerUp: function(){ tone(880, 0.12, "sawtooth", 0.10, 1320); },
      error:   function(){ tone(180, 0.20, "sawtooth", 0.10, 90); },
      gameOver:function(){
        tone(440, 0.25, "sine", 0.12, 330);
        setTimeout(function(){ tone(330, 0.30, "sine", 0.12, 220); }, 200);
        setTimeout(function(){ tone(220, 0.45, "sine", 0.12, 110); }, 450);
      },
      win: function(){
        tone(523, 0.12, "sine", 0.12);
        setTimeout(function(){ tone(659, 0.12, "sine", 0.12); }, 120);
        setTimeout(function(){ tone(784, 0.18, "sine", 0.12); }, 240);
        setTimeout(function(){ tone(1047, 0.3, "sine", 0.12); }, 380);
      }
    };
  })();

  /* =====================================================
     2) HUD — puntuación llamativa, combo, movimientos
     ===================================================== */
  var HUD = (function(){
    var scoreEl   = null;
    var comboEl   = null;
    var movesEl   = null;
    var lastScore = 0;
    var combo     = 0;
    var comboTime = null;
    var MAX_MOVES = 60;
    var movesLeft = MAX_MOVES;
    var moveLock  = false;

    function init(){
      scoreEl = document.getElementById("scoreLabel");
      comboEl = document.getElementById("comboLabel");
      movesEl = document.getElementById("movesCount");
    }
    function updateMoves(){
      if (movesEl) movesEl.textContent = movesLeft;
    }
    function showCombo(){
      combo++;
      if (combo >= 2 && comboEl){
        comboEl.textContent = "COMBO x" + combo + " 🔥";
        comboEl.classList.remove("show");
        void comboEl.offsetWidth;
        comboEl.classList.add("show");
      }
      if (typeof Challenges !== "undefined") Challenges.onCombo(combo);
      clearTimeout(comboTime);
      comboTime = setTimeout(function(){
        combo = 0;
        if (comboEl) comboEl.classList.remove("show");
      }, 1500);
    }
    function floatText(row, col, text){
      var boardEl = document.getElementById("gameBoard");
      if (!boardEl) return;
      var rect = boardEl.getBoundingClientRect();
      var candySize = rect.width / board.boardSize;
      var span = document.createElement("span");
      span.className = "float-score";
      span.textContent = text;
      span.style.left = (rect.left + col * candySize + candySize/2 - 12) + "px";
      span.style.top  = (rect.top  + row  * candySize) + "px";
      document.body.appendChild(span);
      setTimeout(function(){ if (span.parentNode) span.parentNode.removeChild(span); }, 950);
    }

    return {
      init: function(){
        init();
        lastScore = 0;
        combo = 0;
        movesLeft = MAX_MOVES;
        updateMoves();
        if (scoreEl){ scoreEl.textContent = "0"; scoreEl.classList.remove("bump"); }
      },
      reset: function(){ this.init(); },
      onScoreUpdate: function(info){
        if (!scoreEl) init();
        scoreEl.textContent = info.score;
        if (info.score > lastScore){
          scoreEl.classList.remove("bump");
          void scoreEl.offsetWidth;
          scoreEl.classList.add("bump");
          setTimeout(function(){ scoreEl.classList.remove("bump"); }, 200);
          showCombo();
          if (info.candy) floatText(info.row, info.col, "+1");
        }
        lastScore = info.score;
        if (typeof Challenges !== "undefined") Challenges.updateScore(info.score);
      },
      onCrush: function(crushes){
        var total = 0;
        for (var i = 0; i < crushes.length; i++) total += crushes[i].length;
        if (total >= 5) showCombo();
        if (typeof Challenges !== "undefined") Challenges.onCrush(crushes);
      },
      registerMove: function(){
        if (moveLock) return;
        movesLeft = Math.max(0, movesLeft - 1);
        updateMoves();
        if (movesLeft === 0){
          setTimeout(function(){
            if (typeof SoundFX !== "undefined") SoundFX.gameOver();
            var t = document.getElementById("toast");
            if (t){ t.textContent = "¡Sin movimientos! Pulsa New Game"; t.classList.add("show"); setTimeout(function(){ t.classList.remove("show"); }, 3000); }
          }, 800);
        }
      },
      addMoves: function(n){
        movesLeft += n;
        updateMoves();
      },
      getMoves: function(){ return movesLeft; }
    };
  })();

  /* =====================================================
     3) PowerUps — Martillo, Mezclar, +5 Movimientos
     ===================================================== */
  var PowerUps = (function(){
    var hammerCount  = 3;
    var shuffleCount = 2;
    var extraCount   = 1;
    var hammerActive = false;

    function updateBadges(){
      var h = document.getElementById("hammerCount");
      var s = document.getElementById("shuffleCount");
      var e = document.getElementById("extraCount");
      var bh = document.getElementById("btnHammer");
      var bs = document.getElementById("btnShuffle");
      var be = document.getElementById("btnExtra");
      if (h) h.textContent = hammerCount;
      if (s) s.textContent = shuffleCount;
      if (e) e.textContent = extraCount;
      if (bh) bh.disabled = hammerCount <= 0;
      if (bs) bs.disabled = shuffleCount <= 0;
      if (be) be.disabled = extraCount <= 0;
    }

    function toast(msg){
      var t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(function(){ t.classList.remove("show"); }, 1800);
    }

    function bindButtons(){
      var bh = document.getElementById("btnHammer");
      var bs = document.getElementById("btnShuffle");
      var be = document.getElementById("btnExtra");
      var bS = document.getElementById("btnSound");

      if (bh) bh.addEventListener("click", function(){
        if (hammerCount <= 0) return;
        hammerActive = !hammerActive;
        document.body.classList.toggle("hammer-mode", hammerActive);
        bh.classList.toggle("active", hammerActive);
        if (typeof SoundFX !== "undefined") SoundFX.powerUp();
        toast(hammerActive ? "🔨 Martillo activo — pulsa un caramelo" : "Martillo desactivado");
      });

      if (bs) bs.addEventListener("click", function(){
        if (shuffleCount <= 0) return;
        shuffleCount--;
        updateBadges();
        if (typeof SoundFX !== "undefined") SoundFX.powerUp();
        doShuffle();
        toast("🔀 Tablero mezclado");
      });

      if (be) be.addEventListener("click", function(){
        if (extraCount <= 0) return;
        extraCount--;
        updateBadges();
        HUD.addMoves(5);
        if (typeof SoundFX !== "undefined") SoundFX.powerUp();
        toast("⏱️ +5 movimientos");
      });

      if (bS) bS.addEventListener("click", function(){
        var on = SoundFX.toggle();
        bS.textContent = on ? "🔊" : "🔇";
        bS.title = on ? "Sonido ON" : "Sonido OFF";
      });
    }

    function doShuffle(){
      var candies = board.getAllCandies();
      var colors = candies.map(function(c){ return c.color; });
      for (var attempt = 0; attempt < 30; attempt++){
        for (var i = colors.length - 1; i > 0; i--){
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = colors[i]; colors[i] = colors[j]; colors[j] = tmp;
        }
        for (var k = 0; k < candies.length; k++){
          Object.defineProperty(candies[k], 'color', {value: colors[k], writable:false, configurable:true});
        }
        if (rules.getCandyCrushes().length === 0) return;
      }
      setTimeout(function(){ if (typeof Crush === "function") Crush(); }, 50);
    }

    return {
      init: function(){ updateBadges(); bindButtons(); },
      reset: function(){
        hammerCount = 3; shuffleCount = 2; extraCount = 1; hammerActive = false;
        document.body.classList.remove("hammer-mode");
        var bh = document.getElementById("btnHammer");
        if (bh) bh.classList.remove("active");
        updateBadges();
      },
      isHammerActive: function(){ return hammerActive; },
      useHammerAt: function(row, col){
        var candy = board.getCandyAt(row, col);
        if (!candy) return;
        hammerCount--;
        hammerActive = false;
        document.body.classList.remove("hammer-mode");
        var bh = document.getElementById("btnHammer");
        if (bh) bh.classList.remove("active");
        updateBadges();
        if (typeof SoundFX !== "undefined") SoundFX.crush(1);
        board.incrementScore(candy, row, col);
        board.remove(candy);
        setTimeout(function(){ rules.moveCandiesDown(); }, 300);
        toast("🔨 ¡Caramelo roto!");
        if (typeof Challenges !== "undefined") Challenges.onHammer();
      }
    };
  })();

  /* =====================================================
     4) Challenges — retos típicos de Candy Crush

  var Challenges = (function(){

    var levels = [

      { name: "Nivel 2", scoreGoal: 1600, colorGoal: 'blue',  colorTarget: 14, comboGoal: 4, time: 200, stars: [1600, 2600, 3800] },
      { name: "Nivel 3", scoreGoal: 2400, colorGoal: 'yellow',colorTarget: 18, comboGoal: 5, time: 180, stars: [2400, 3600, 5000] },

    function getLevel(){ return levels[currentLevel]; }

    function updateUI(){

      // Temporizador
      if (timerBox){
        timerBox.textContent = '⏱️ ' + Math.max(0, timeLeft) + 's';
        timerBox.classList.toggle('warn', timeLeft <= 20 && running);
      }
    }

    function stopTimer(){
      running = false;
      if (timer) { clearInterval(timer); timer = null; }
    }

    function startTimer(){
      stopTimer();
      var lvl = getLevel();
      timeLeft = lvl.time;
      running = true;
      updateUI();
      timer = setInterval(function(){
        if (!running) return;
        timeLeft--;
        updateUI();
        if (timeLeft <= 0){
          stopTimer();
          onTimeUp();
        }
      }, 1000);
    }

    function onTimeUp(){
      if (completed) return;
      var lvl = getLevel();
      var scoreOk = board.getScore() >= lvl.scoreGoal;
      var colorOk = collectedColor >= lvl.colorTarget;
      var comboOk = maxCombo >= lvl.comboGoal;
      if (scoreOk && colorOk && comboOk){
        completeLevel();
      } else {
        showToast('⏰ ¡Tiempo agotado! Objetivos no completados');
        if (typeof SoundFX !== "undefined") SoundFX.gameOver();
      }
    }

    function checkCompletion(){
      if (completed) return;
      var lvl = getLevel();
      var scoreOk = board.getScore() >= lvl.scoreGoal;
      var colorOk = collectedColor >= lvl.colorTarget;
      var comboOk = maxCombo >= lvl.comboGoal;
      if (scoreOk && colorOk && comboOk){
        completeLevel();
      }
    }

    function completeLevel(){
      if (completed) return;
      completed = true;
      stopTimer();
      if (typeof SoundFX !== "undefined") SoundFX.win();
      var msg = '🎉 ¡Nivel superado! ';
      if (currentLevel < levels.length - 1){
        msg += 'Pasando al siguiente nivel...';
        setTimeout(function(){
          currentLevel++;
          resetLevel();
        }, 2000);
      } else {
        msg += '¡Has completado todos los niveles! 🏆';
      }
      showToast(msg);
      updateUI();
    }

    function resetLevel(){
      completed = false;
      collectedColor = 0;
      maxCombo = 0;
      hammerUses = 0;
      // Reiniciar tablero
      if (typeof NewGame === 'function') {
        NewGame();
      }
      startTimer();
      updateUI();
    }

    function showToast(msg){
      var t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(function(){ t.classList.remove("show"); }, 3000);
    }

    return {
      init: function(){
        levelBadge = document.getElementById("levelBadge");
        timerBox = document.getElementById("timerBox");
        starsBox = document.getElementById("starsBox");
        chScore = document.getElementById("chScore");
        chRed = document.getElementById("chRed");
        chCombo = document.getElementById("chCombo");

        // Sobrescribir reset de HUD para que no interfiera con timer
        var origReset = HUD.reset;
        HUD.reset = function(){
          origReset.call(HUD);
          collectedColor = 0;
          maxCombo = 0;
          completed = false;
          updateUI();
        };

        updateUI();
        startTimer();
      },

      onCrush: function(crushes){
        var lvl = getLevel();
        for (var i = 0; i < crushes.length; i++){
          for (var j = 0; j < crushes[i].length; j++){
            if (crushes[i][j].color === lvl.colorGoal) collectedColor++;
          }
        }
        updateUI();
        checkCompletion();
      },

      onCombo: function(combo){
        if (combo > maxCombo) maxCombo = combo;
        updateUI();
        checkCompletion();
      },

      onHammer: function(){
        hammerUses++;
      },

      updateScore: function(score){
        updateUI();
        checkCompletion();
      },

      reset: function(){
        currentLevel = 0;
        collectedColor = 0;
        maxCombo = 0;
        completed = false;
        hammerUses = 0;
        updateUI();
        startTimer();
      },

      stopTimer: stopTimer
    };
  })();

  /* =====================================================
     5) Arranque
     ===================================================== */
  $(document).ready(function(){
    HUD.init();
    PowerUps.init();
    Challenges.init();
  });
  </script>
</body>
</html>
