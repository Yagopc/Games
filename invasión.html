<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Invaders Mobile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #000;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    #game {
      position: relative;
      width: 100%;
      height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: url('fondo.gif') center/cover no-repeat;
    }
    
    #contentHome, #contentGame, #contentSettings {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      transition: opacity 0.3s ease;
    }
    
    #contentHome {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 50;
    }
    
    #contentSettings {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 100;
      color: white;
      font-family: Arial, sans-serif;
    }
    
    .settings-panel {
      background-color: rgba(50, 50, 50, 0.8);
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      max-width: 400px;
    }
    
    .settings-title {
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
      color: #0af;
    }
    
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
    }
    
    .settings-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
    }
    
    .settings-button {
      padding: 10px 20px;
      border-radius: 5px;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    
    #saveSettings {
      background-color: #0a0;
    }
    
    #cancelSettings {
      background-color: #a00;
    }
    
    #logo {
      width: 300px;
      height: 150px;
      margin-bottom: 40px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150"><text x="150" y="80" font-family="Arial" font-size="40" fill="white" text-anchor="middle">SPACE INVADERS</text></svg>') center no-repeat;
    }
    
    .game-button {
      display: inline-block;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 28px;
      text-decoration: none;
      padding: 15px 50px;
      background-color: rgba(0, 150, 255, 0.8);
      border-radius: 10px;
      transition: all 0.2s;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 100, 255, 0.6);
      margin: 10px 0;
      cursor: pointer;
    }
    
    .game-button:active, .game-button:hover {
      background-color: rgba(0, 180, 255, 0.9);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.8);
    }
    
    #player, #score {
      position: absolute;
      top: 15px;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 18px;
      text-shadow: 1px 1px 2px #000;
      z-index: 30;
    }
    
    #player {
      left: 25px;
    }
    
    #score {
      right: 25px;
    }
    
    #player b, #score b {
      color: #ff0;
    }
    
    /* Elementos del juego */
    .enemy {
      position: absolute;
      width: 40px;
      height: 40px;
      background: url('ufo.gif') center/contain no-repeat;
      z-index: 10;
    }
    
    #aircraft {
      position: absolute;
      width: 50px;
      height: 50px;
      bottom: 80px;
      left: 50%;
      margin-left: -25px;
      background: url('nave.gif') center/contain no-repeat;
      z-index: 20;
      transition: left 0.1s linear;
    }
    
    #missile {
      position: absolute;
      width: 4px;
      height: 15px;
      bottom: 130px;
      left: 50%;
      margin-left: -2px;
      background-color: #ff0;
      display: none;
      z-index: 15;
      box-shadow: 0 0 5px #ff0;
    }
    
    /* Animaciones */
    @keyframes explosion {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.8; }
      100% { transform: scale(2); opacity: 0; }
    }
    
    .explosion {
      animation: explosion 0.4s ease-out forwards;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="none" stroke="yellow" stroke-width="2"/><circle cx="15" cy="15" r="10" fill="none" stroke="orange" stroke-width="2"/><circle cx="15" cy="15" r="6" fill="none" stroke="red" stroke-width="2"/></svg>') center no-repeat;
    }
  </style>
</head>
<body>
  <div id='game'>
    <span id='player'> 1UP <b>0</b> </span>
    <span id='score'> HI-SCORE <b>5000</b> </span>
    
    <div id='contentHome'>
      <span id="logo"></span>
      <button id="startButton" class="game-button">INICIAR JUEGO</button>
      <button id="settingsButton" class="game-button">CONFIGURACIÓN</button>
    </div>
    
    <div id='contentSettings'>
      <div class="settings-panel">
        <div class="settings-title">CONFIGURACIÓN DE SONIDO</div>
        
        <div class="setting-item">
          <label for="soundBackground">Sonido de fondo</label>
          <input type="checkbox" id="soundBackground" checked>
        </div>
        
        <div class="setting-item">
          <label for="soundShoot">Sonido de disparo</label>
          <input type="checkbox" id="soundShoot" checked>
        </div>
        
        <div class="setting-item">
          <label for="soundExplosion">Sonido de explosión</label>
          <input type="checkbox" id="soundExplosion" checked>
        </div>
        
        <div class="settings-buttons">
          <button id="saveSettings" class="settings-button">GUARDAR</button>
          <button id="cancelSettings" class="settings-button">CANCELAR</button>
        </div>
      </div>
    </div>
    
    <div id='contentGame'>
      <!-- Enemigos se generarán aquí -->
      <div id="aircraft"></div>
      <div id="missile"></div>
    </div>
    
    <!-- Elementos de audio -->
    <audio id="backgroundSound" loop>
      <source src="fondo.mp3" type="audio/mp3">
    </audio>
    <audio id="shootSound">
      <source src="disparo.mp3" type="audio/mp3">
    </audio>
    <audio id="explosionSound">
      <source src="explosion.mp3" type="audio/mp3">
    </audio>
  </div>
  
  <script>
    // Objeto principal del juego
    const game = {
      // Variables del juego
      position: 0,
      leftMissile: 0,
      topMissile: 0,
      shotMissile: true,
      amountEnemy: 30,
      enemies: [],
      pointsEnemy: [],
      move: 15,
      margin: 0,
      points: 0,
      lives: 3,
      gameActive: false,
      direction: 1,
      enemySpeed: 500,
      moveDown: false,
      touchStartX: 0,
      
      // Configuración de sonido
      soundSettings: {
        background: true,
        shoot: true,
        explosion: true
      },
      
      // Elementos del DOM
      elements: {
        game: null,
        contentHome: null,
        contentGame: null,
        contentSettings: null,
        aircraft: null,
        missile: null,
        playerScore: null,
        startButton: null,
        settingsButton: null,
        saveSettings: null,
        cancelSettings: null,
        soundBackground: null,
        soundShoot: null,
        soundExplosion: null,
        backgroundSound: null,
        shootSound: null,
        explosionSound: null
      },
      
      // Intervalos
      intervals: {
        enemyMove: null,
        missileMove: null,
        enemyDisplay: null
      },
      
      // Inicialización del juego
      init() {
        console.log("Inicializando juego...");
        
        // Obtener elementos del DOM
        this.elements.game = document.getElementById('game');
        this.elements.contentHome = document.getElementById('contentHome');
        this.elements.contentGame = document.getElementById('contentGame');
        this.elements.contentSettings = document.getElementById('contentSettings');
        this.elements.aircraft = document.getElementById('aircraft');
        this.elements.missile = document.getElementById('missile');
        this.elements.playerScore = document.getElementById('player');
        this.elements.startButton = document.getElementById('startButton');
        this.elements.settingsButton = document.getElementById('settingsButton');
        this.elements.saveSettings = document.getElementById('saveSettings');
        this.elements.cancelSettings = document.getElementById('cancelSettings');
        this.elements.soundBackground = document.getElementById('soundBackground');
        this.elements.soundShoot = document.getElementById('soundShoot');
        this.elements.soundExplosion = document.getElementById('soundExplosion');
        this.elements.backgroundSound = document.getElementById('backgroundSound');
        this.elements.shootSound = document.getElementById('shootSound');
        this.elements.explosionSound = document.getElementById('explosionSound');
        
        // Cargar configuración guardada
        this.loadSettings();
        
        // Configurar eventos
        this.setupEvents();
        
        // Calcular límites de movimiento
        this.calculateBounds();
        
        // Ocultar área de juego al inicio
        this.elements.contentGame.style.display = 'none';
        
        console.log("Juego inicializado correctamente");
      },
      
      // Configurar eventos del juego
      setupEvents() {
        // Botón de inicio
        this.elements.startButton.addEventListener('click', (e) => {
          e.preventDefault();
          this.startGame();
        }, false);
        
        // Botón de configuración
        this.elements.settingsButton.addEventListener('click', (e) => {
          e.preventDefault();
          this.showSettings();
        }, false);
        
        // Botón guardar configuración
        this.elements.saveSettings.addEventListener('click', (e) => {
          e.preventDefault();
          this.saveSettings();
        }, false);
        
        // Botón cancelar configuración
        this.elements.cancelSettings.addEventListener('click', (e) => {
          e.preventDefault();
          this.hideSettings();
        }, false);
        
        // Control táctil para mover la nave horizontalmente y disparar en la posición vertical del toque
this.elements.game.addEventListener('touchstart', (e) => {
  if (!this.gameActive) return;
  
  e.preventDefault();
  const touch = e.touches[0];
  
  // Mover la nave horizontalmente a la posición del toque
  const gameWidth = this.elements.game.offsetWidth;
  const touchX = touch.clientX;
  const newLeft = Math.min(Math.max(20, touchX - 25), gameWidth - 70);
  
  this.elements.aircraft.style.left = newLeft + 'px';
  
  // Disparar al tocar cualquier parte de la pantalla
  if (this.shotMissile) {
    this.fireMissile(touch.clientY);
  }
}, false);

// También funciona con clics de ratón para pruebas
this.elements.game.addEventListener('mousedown', (e) => {
  if (!this.gameActive) return;
  
  e.preventDefault();
  
  // Mover la nave horizontalmente a la posición del clic
  const gameWidth = this.elements.game.offsetWidth;
  const clickX = e.clientX;
  const newLeft = Math.min(Math.max(20, clickX - 25), gameWidth - 70);
  
  this.elements.aircraft.style.left = newLeft + 'px';
  
  // Disparar al hacer clic en cualquier parte de la pantalla
  if (this.shotMissile) {
    this.fireMissile(e.clientY);
  }
}, false);
        
        // Eventos de teclado para pruebas
        document.addEventListener('keydown', (e) => {
          if (!this.gameActive) return;
          
          switch(e.keyCode) {
            case 38: // Flecha arriba
              const currentBottom = parseInt(this.elements.aircraft.style.bottom || '80px');
              this.elements.aircraft.style.bottom = Math.min(currentBottom + 20, window.innerHeight - 30) + 'px';
              break;
            case 40: // Flecha abajo
              const currentBottom2 = parseInt(this.elements.aircraft.style.bottom || '80px');
              this.elements.aircraft.style.bottom = Math.max(30, currentBottom2 - 20) + 'px';
              break;
            case 32: // Espacio
              if (this.shotMissile) {
                this.fireMissile();
              }
              break;
          }
        }, false);
      },
      
      // Mostrar configuración
      showSettings() {
        this.elements.contentHome.style.opacity = '0';
        this.elements.contentHome.style.pointerEvents = 'none';
        
        // Mostrar configuración actual en los controles
        this.elements.soundBackground.checked = this.soundSettings.background;
        this.elements.soundShoot.checked = this.soundSettings.shoot;
        this.elements.soundExplosion.checked = this.soundSettings.explosion;
        
        this.elements.contentSettings.style.display = 'flex';
        setTimeout(() => {
          this.elements.contentSettings.style.opacity = '1';
        }, 10);
      },
      
      // Ocultar configuración
      hideSettings() {
        this.elements.contentSettings.style.opacity = '0';
        setTimeout(() => {
          this.elements.contentSettings.style.display = 'none';
          this.elements.contentHome.style.opacity = '1';
          this.elements.contentHome.style.pointerEvents = 'auto';
        }, 300);
      },
      
      // Guardar configuración
      saveSettings() {
        this.soundSettings.background = this.elements.soundBackground.checked;
        this.soundSettings.shoot = this.elements.soundShoot.checked;
        this.soundSettings.explosion = this.elements.soundExplosion.checked;
        
        // Guardar en localStorage
        localStorage.setItem('spaceInvadersSoundSettings', JSON.stringify(this.soundSettings));
        
        // Actualizar sonidos
        if (this.soundSettings.background && this.gameActive) {
          this.elements.backgroundSound.play().catch(e => console.log("No se pudo reproducir sonido:", e));
        } else {
          this.elements.backgroundSound.pause();
        }
        
        this.hideSettings();
      },
      
      // Cargar configuración guardada
      loadSettings() {
        const savedSettings = localStorage.getItem('spaceInvadersSoundSettings');
        if (savedSettings) {
          this.soundSettings = JSON.parse(savedSettings);
        }
      },
      
      // Calcular límites de movimiento
      calculateBounds() {
        const gameWidth = this.elements.game.offsetWidth;
        this.stopLeft = 20;
        this.stopRight = gameWidth - 70;
        
        // Posicionar nave al centro
        this.elements.aircraft.style.left = (gameWidth / 2 - 25) + 'px';
        this.elements.aircraft.style.bottom = '80px';
      },
      
      // Iniciar juego
      startGame() {
        console.log("Iniciando juego...");
        
        // Ocultar menú principal
        this.elements.contentHome.style.opacity = '0';
        this.elements.contentHome.style.pointerEvents = 'none';
        
        // Mostrar área de juego
        this.elements.contentGame.style.display = 'block';
        setTimeout(() => {
          this.elements.contentGame.style.opacity = '1';
          
          // Reiniciar estado del juego
          this.resetGame();
          
          // Crear enemigos
          this.createEnemies();
          
          // Mostrar enemigos gradualmente
          this.showEnemies();
          
          // Iniciar sonido de fondo si está activado
          if (this.soundSettings.background) {
            this.elements.backgroundSound.play().catch(e => console.log("No se pudo reproducir sonido:", e));
          }
          
          // Iniciar movimiento de enemigos después de un retraso
          setTimeout(() => {
            this.startEnemyMovement();
            this.gameActive = true;
          }, 2000);
          
        }, 300);
      },
      
      // Reiniciar estado del juego
      resetGame() {
        // Limpiar intervalos anteriores
        this.clearIntervals();
        
        // Reiniciar variables
        this.points = 0;
        this.lives = 3;
        this.gameActive = false;
        this.direction = 1;
        this.enemySpeed = 500;
        this.moveDown = false;
        
        // Actualizar puntuación
        this.updateScore();
        
        // Posicionar nave
        this.calculateBounds();
        this.elements.missile.style.display = 'none';
        
        // Detener sonido de fondo
        this.elements.backgroundSound.pause();
        this.elements.backgroundSound.currentTime = 0;
      },
      
      // Limpiar intervalos
      clearIntervals() {
        for (const interval in this.intervals) {
          clearInterval(this.intervals[interval]);
          this.intervals[interval] = null;
        }
      },
      
      // Crear enemigos
      createEnemies() {
        console.log("Creando enemigos...");
        
        // Eliminar enemigos anteriores si existen
        const oldEnemies = document.querySelectorAll('.enemy');
        oldEnemies.forEach(enemy => enemy.remove());
        
        this.enemies = [];
        this.pointsEnemy = [];
        
        const contentGame = this.elements.contentGame;
        const rows = 3;
        const cols = 8;
        this.amountEnemy = rows * cols;
        
        // Crear enemigos en formación de cuadrícula
        for (let i = 0; i < this.amountEnemy; i++) {
          const enemy = document.createElement('div');
          enemy.className = 'enemy';
          enemy.id = 'enemy' + i;
          enemy.style.display = 'none';
          
          const row = Math.floor(i / cols);
          const col = i % cols;
          
          enemy.style.left = (col * 45 + 30) + 'px';
          enemy.style.top = (row * 45 + 50) + 'px';
          
          contentGame.appendChild(enemy);
          this.enemies.push(enemy);
          this.pointsEnemy[i] = (rows - row) * 10; // Más puntos por enemigos superiores
        }
      },
      
      // Mostrar enemigos gradualmente
      showEnemies() {
        let count = 0;
        this.intervals.enemyDisplay = setInterval(() => {
          if (count < this.amountEnemy) {
            this.enemies[count].style.display = 'block';
            count++;
          } else {
            clearInterval(this.intervals.enemyDisplay);
          }
        }, 50);
      },
      
      // Iniciar movimiento de enemigos
      startEnemyMovement() {
        this.intervals.enemyMove = setInterval(() => {
          this.moveEnemies();
        }, this.enemySpeed);
      },
      
      // Mover enemigos (función corregida)
moveEnemies() {
    let edgeReached = false;
    const gameWidth = this.elements.game.offsetWidth;
    const enemyWidth = 40; // Ancho del enemigo
    
    // Verificar si algún enemigo ha llegado al borde
    this.enemies.forEach(enemy => {
        if (enemy.style.display !== 'none') {
            const left = parseInt(enemy.style.left);
            if ((left <= 10 && this.direction === -1) || 
                (left >= gameWidth - enemyWidth - 10 && this.direction === 1)) {
                edgeReached = true;
            }
        }
    });

    // Mover enemigos
    this.enemies.forEach(enemy => {
        if (enemy.style.display !== 'none') {
            const currentLeft = parseInt(enemy.style.left);
            const currentTop = parseInt(enemy.style.top);
            
            if (edgeReached && !this.moveDown) {
                enemy.style.top = (currentTop + 25) + 'px';
                this.moveDown = true;
            } else if (!this.moveDown) {
                enemy.style.left = (currentLeft + (10 * this.direction)) + 'px';
            }
            
            // Verificar si el enemigo ha llegado muy abajo (fin del juego)
            if (currentTop > window.innerHeight - 150) {
                if (this.gameActive) { // Solo terminar el juego si aún está activo
                    this.gameOver();
                }
                return;
            }
        }
    });
    
    if (this.moveDown) {
        this.direction *= -1; // Cambiar dirección
        setTimeout(() => { 
            this.moveDown = false;
            // Aumentar velocidad gradualmente
            this.enemySpeed = Math.max(200, this.enemySpeed - 10);
            clearInterval(this.intervals.enemyMove);
            if (this.gameActive) { // Solo reiniciar movimiento si el juego está activo
                this.startEnemyMovement();
            }
        }, 300);
    }
},

// Game over corregido
gameOver() {
    if (!this.gameActive) return; // Evitar múltiples llamadas
    
    this.gameActive = false;
    this.clearIntervals();
    
    // Detener sonido de fondo
    this.elements.backgroundSound.pause();
    
    // Mostrar alerta solo una vez
    if (!this.gameOverShown) {
        this.gameOverShown = true;
        alert('¡Game Over! Puntuación final: ' + this.points);
        setTimeout(() => {
            this.returnToMenu();
            this.gameOverShown = false; // Restablecer para la próxima partida
        }, 1500);
    }
},

// Añadir esta variable al objeto game
gameOverShown: false,
      // Disparar misil
      fireMissile() {
        if (!this.shotMissile || !this.gameActive) return;
        
        this.shotMissile = false;
        this.elements.missile.style.display = 'block';
        this.leftMissile = parseInt(this.elements.aircraft.style.left);
        this.elements.missile.style.left = (this.leftMissile + 23) + 'px';
        this.topMissile = parseInt(this.elements.aircraft.style.bottom) + 50;
        this.elements.missile.style.bottom = this.topMissile + 'px';
        
        // Reproducir sonido de disparo si está activado
        if (this.soundSettings.shoot) {
          this.elements.shootSound.currentTime = 0;
          this.elements.shootSound.play().catch(e => console.log("No se pudo reproducir sonido:", e));
        }
        
        this.intervals.missileMove = setInterval(() => {
          this.topMissile += 10;
          this.elements.missile.style.bottom = this.topMissile + 'px';
          
          // Verificar colisión con enemigos
          this.checkCollisions();
          
          // Verificar si el misil salió de la pantalla
          if (this.topMissile > window.innerHeight) {
            this.resetMissile();
          }
        }, 30);
      },
      
      // Verificar colisiones
      checkCollisions() {
        const missileRect = this.elements.missile.getBoundingClientRect();
        
        this.enemies.forEach((enemy, index) => {
          if (enemy.style.display !== 'none') {
            const enemyRect = enemy.getBoundingClientRect();
            
            if (
              missileRect.left < enemyRect.right &&
              missileRect.right > enemyRect.left &&
              missileRect.top < enemyRect.bottom &&
              missileRect.bottom > enemyRect.top
            ) {
              // Colisión detectada
              this.destroyEnemy(enemy, index);
              this.resetMissile();
            }
          }
        });
      },
      
      // Destruir enemigo
      destroyEnemy(enemy, index) {
        enemy.classList.add('explosion');
        this.points += this.pointsEnemy[index];
        this.updateScore();
        
        // Reproducir sonido de explosión si está activado
        if (this.soundSettings.explosion) {
          this.elements.explosionSound.currentTime = 0;
          this.elements.explosionSound.play().catch(e => console.log("No se pudo reproducir sonido:", e));
        }
        
        setTimeout(() => {
          enemy.remove();
          
          // Verificar si todos los enemigos han sido eliminados
          const remainingEnemies = document.querySelectorAll('.enemy');
          if (remainingEnemies.length === 0) {
            this.levelComplete();
          }
        }, 400);
      },
      
      // Reiniciar misil
      resetMissile() {
        clearInterval(this.intervals.missileMove);
        this.elements.missile.style.display = 'none';
        this.shotMissile = true;
        this.topMissile = 0;
      },
      
      // Actualizar puntuación
      updateScore() {
        this.elements.playerScore.innerHTML = '1UP <b>' + this.points + '</b>';
      },
      
      // Nivel completado
      levelComplete() {
        this.gameActive = false;
        clearInterval(this.intervals.enemyMove);
        
        // Detener sonido de fondo
        this.elements.backgroundSound.pause();
        
        alert('¡Nivel completado! Puntuación: ' + this.points);
        setTimeout(() => {
          this.startGame();
        }, 1500);
      },
      
      // Game over corregido
gameOver() {
    if (!this.gameActive) return; // Evitar múltiples llamadas
    
    this.gameActive = false;
    this.clearIntervals();
    
    // Detener sonido de fondo
    this.elements.backgroundSound.pause();
    
    // Mostrar alerta solo una vez
    if (!this.gameOverShown) {
        this.gameOverShown = true;
        alert('¡Game Over! Puntuación final: ' + this.points);
        setTimeout(() => {
            this.returnToMenu();
            this.gameOverShown = false; // Restablecer para la próxima partida
        }, 1500);
    }
},

      
      // Volver al menú
      returnToMenu() {
        this.elements.contentGame.style.opacity = '0';
        setTimeout(() => {
          this.elements.contentGame.style.display = 'none';
          this.elements.contentHome.style.opacity = '1';
          this.elements.contentHome.style.pointerEvents = 'auto';
        }, 300);
      }
    };
    
    // Iniciar el juego cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', () => {
      game.init();
      
      // Ajustar tamaños al cambiar la orientación
      window.addEventListener('resize', () => {
        game.calculateBounds();
      });
    });
  </script>
</body>
</html>
