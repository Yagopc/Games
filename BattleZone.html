<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Battlezone Clone</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family:'Courier New', monospace; touch-action:none; user-select:none;
}
#app { display:flex; flex-direction:column; width:100%; height:100dvh; }

/* HUD superior */
#hud {
    height: 50px; display:flex; justify-content:space-around; align-items:center;
    background:#0a0a0a; border-bottom:2px solid #1a3a1a;
    color:#00ff00; font-size:clamp(11px, 3.2vw, 15px);
    padding:0 6px; text-shadow:0 0 5px #00ff00; position:relative; z-index: 5;
}
#hud .item { display:flex; flex-direction:column; align-items:center; line-height:1.1; }
#hud .label { font-size:0.65em; color:#00aa00; }
#hud .value { font-weight:bold; font-size:1.1em; }
#radar-container {
    width:42px; height:42px; border-radius:50%;
    border:1px solid #00ff00; background:rgba(0,20,0,0.5); overflow:hidden;
}
#radarCanvas { width:100%; height:100%; }

/* Canvas del juego */
#game-container { flex:1; position:relative; background:#000; overflow:hidden; display:flex; justify-content:center; align-items:center; }
#gameCanvas { display:block; width:100%; height:100%; object-fit:contain; }

/* Overlay de Inicio / Game Over */
#start-overlay {
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.8); z-index:20; gap:16px;
}
#start-overlay.hidden { display:none; }
.main-btn {
    background:#1a3a1a; border:2px solid #00ff00; color:#00ff00;
    padding:14px 28px; font-family:inherit; font-weight:bold;
    font-size:clamp(18px, 5vw, 24px); border-radius:8px; cursor:pointer;
    box-shadow: 0 0 15px #00ff00; text-shadow:0 0 8px #00ff00;
}
.main-btn:active { background:#00ff00; color:#000; }

/* Panel de Ajustes */
#settings-panel {
    position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    width:88%; max-width:320px; background:#0c1a0c; border:2px solid #00ff00;
    border-radius:10px; padding:16px; display:none; flex-direction:column; gap:12px;
    z-index:30; color:#00ff00; box-shadow:0 0 20px rgba(0,255,0,0.3);
}
#settings-panel.visible { display:flex; }
.settings-title { text-align:center; font-weight:bold; font-size:1.1em; border-bottom:1px solid #1a3a1a; padding-bottom:6px; }
.settings-row { display:flex; justify-content:space-between; align-items:center; font-size:0.85em; gap:8px; }
.settings-row label { flex:1; }
.settings-row select, .settings-row input[type="range"] { flex:1.2; background:#000; color:#00ff00; border:1px solid #00ff00; padding:4px; border-radius:4px; font-family:inherit; }
.settings-row input[type="checkbox"] { width:20px; height:20px; accent-color:#00ff00; cursor:pointer; }
.settings-close {
    background:#1a3a1a; border:1px solid #00ff00; color:#00ff00;
    padding:8px; font-family:inherit; font-weight:bold; border-radius:6px; cursor:pointer; margin-top:8px;
}

/* Controles inferiores */
#controls {
    height: 110px; display:grid; grid-template-columns: repeat(5, 1fr);
    gap:5px; padding:8px; background:#0a0a0a; border-top:2px solid #1a3a1a;
}
.btn {
    display:flex; align-items:center; justify-content:center;
    background:#111; border:1px solid #1a3a1a; border-radius:8px;
    color:#00ff00; font-size:clamp(20px, 6vw, 32px);
    font-weight:bold; text-shadow:0 0 6px #00ff00;
    cursor:pointer; transition:background 0.05s; touch-action:none;
    user-select:none; -webkit-user-select:none;
}
.btn:active, .btn.active { background:#1a3a1a; box-shadow:0 0 14px #00ff00 inset; }
.btn.fire { background:#2a0a0a; border-color:#4a1a1a; color:#ff4444; text-shadow:0 0 6px #ff4444; }
.btn.fire:active, .btn.fire.active { background:#4a1a1a; box-shadow:0 0 14px #ff4444 inset; }
.btn.gear { font-size:clamp(18px, 5vw, 26px); color:#88ff88; }
</style>
</head>
<body>
<div id="app">
    <div id="hud">
        <div class="item">
            <span class="label">PUNTOS</span>
            <span class="value" id="scoreDisplay">0</span>
        </div>
        <div class="item">
            <span class="label">VIDAS</span>
            <span class="value" id="livesDisplay">3</span>
        </div>
        <div id="radar-container">
            <canvas id="radarCanvas" width="84" height="84"></canvas>
        </div>
        <div class="item">
            <span class="label">NIVEL</span>
            <span class="value" id="levelDisplay">1</span>
        </div>
        <div class="item">
            <span class="label">BAJAS</span>
            <span class="value" id="killsDisplay">0</span>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="start-overlay">
            <div id="overlayText" style="display:none; color:#ff4444; font-size:22px; font-weight:bold; text-shadow:0 0 8px #ff4444;">GAME OVER</div>
            <button class="main-btn" id="btnStartGame">INICIAR JUEGO</button>
        </div>

        <div id="settings-panel">
            <div class="settings-title">⚙ CONFIGURACIÓN</div>
            <div class="settings-row">
                <label>🔊 Sonido</label>
                <input type="checkbox" id="soundToggle" checked>
            </div>
            <div class="settings-row">
                <label>⚡ Dificultad</label>
                <select id="diffSelect">
                    <option value="easy">Fácil</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Difícil</option>
                </select>
            </div>
            <div class="settings-row">
                <label>❤️ Vidas: <span id="livesVal">3</span></label>
                <input type="range" id="livesRange" min="3" max="10" value="3">
            </div>
            <div class="settings-row">
                <label>✨ Modo Dios</label>
                <input type="checkbox" id="godModeToggle">
            </div>
            <button class="settings-close" id="settingsClose">GUARDAR Y CERRAR</button>
        </div>
    </div>

    <div id="controls">
        <button class="btn" id="btnLeft">↺</button>
        <button class="btn" id="btnRight">↻</button>
        <button class="btn" id="btnForward">▲</button>
        <button class="btn fire" id="btnFire">🔥</button>
        <button class="btn gear" id="btnSettings">⚙</button>
    </div>
</div>

<script>
(function(){
"use strict";

const CANVAS_W = 320;
const CANVAS_H = 400;
const FOV = 65;
const NEAR = 1.0;
const FAR = 400;
const WORLD_SIZE = 400;
const HORIZON_Y = CANVAS_H * 0.55;
const EYE_HEIGHT = 6;

const config = {
    sound: true,
    difficulty: 'normal',
    lives: 3,
    godMode: false
};

const diffSettings = {
    easy: { spawnInterval: 15, killsForLevel: 5 },
    normal: { spawnInterval: 10, killsForLevel: 20 },
    hard: { spawnInterval: 5, killsForLevel: 30 }
};

function loadConfig() {
    try {
        const saved = localStorage.getItem('battlezone_config');
        if (saved) {
            const parsed = JSON.parse(saved);
            Object.assign(config, parsed);
        }
    } catch(e){}
}

function saveConfig() {
    try {
        localStorage.setItem('battlezone_config', JSON.stringify(config));
    } catch(e){}
}

const state = {
    running: false,
    score: 0,
    lives: 3,
    level: 1,
    levelKills: 0,
    player: { x: 0, z: 0, angle: 0, speed: 0, radius: 4 },
    enemies: [],
    bullets: [],
    enemyBullets: [],
    obstacles: [],
    particles: [],
    mountains: [],
    lastTime: 0,
    enemySpawnTimer: 0,
    hitFlash: 0,
    engineOsc: null,
    engineGain: null
};

let audioCtx = null;
function initAudio() {
    if (audioCtx) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        state.engineOsc = audioCtx.createOscillator();
        state.engineOsc.type = 'sawtooth';
        state.engineOsc.frequency.value = 40;
        state.engineGain = audioCtx.createGain();
        state.engineGain.gain.value = 0;
        state.engineOsc.connect(state.engineGain);
        state.engineGain.connect(audioCtx.destination);
        state.engineOsc.start();
    } catch(e) {}
}

function updateEngineSound() {
    if (!state.engineGain || !state.engineOsc) return;
    if (!config.sound || !state.running) {
        state.engineGain.gain.value = 0;
        return;
    }
    const speedRatio = Math.abs(state.player.speed) / 24;
    state.engineOsc.frequency.value = 35 + speedRatio * 85;
    state.engineGain.gain.value = 0.02 + speedRatio * 0.04;
}

function playTone(freq, duration, type, vol) {
    if (!config.sound || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function playNoise(duration, vol) {
    if (!config.sound || !audioCtx) return;
    try {
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(vol || 0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        source.connect(gain); gain.connect(audioCtx.destination);
        source.start();
    } catch(e) {}
}

function playFire() { playTone(880, 0.08, 'square', 0.12); }
function playExplosion() { playNoise(0.5, 0.3); }
function playHit() { playNoise(0.6, 0.3); }

function project3D(x, y, z, camX, camY, camZ, camAngle) {
    const dx = x - camX;
    const dy = y - camY;
    const dz = z - camZ;
    const cos = Math.cos(-camAngle);
    const sin = Math.sin(-camAngle);
    const rx = dx * cos - dz * sin;
    const rz = dx * sin + dz * cos;
    if (rz > -NEAR || rz < -FAR) return null;
    const depth = -rz;
    const scale = (CANVAS_H / 2) / Math.tan((FOV / 2) * Math.PI / 180) / depth;
    return {
        x: CANVAS_W / 2 + rx * scale,
        y: HORIZON_Y - dy * scale,
        scale, depth
    };
}

function drawLine3D(ctx, p1, p2, cam, color, lw) {
    const a = project3D(p1[0], p1[1], p1[2], cam.x, cam.y, cam.z, cam.a);
    const b = project3D(p2[0], p2[1], p2[2], cam.x, cam.y, cam.z, cam.a);
    if (!a || !b) return;
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = lw || 1;
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
}

function drawBox3D(ctx, cx, cz, sx, sz, h, yaw, cam, color, lw) {
    const c = Math.cos(yaw), s = Math.sin(yaw);
    const hx = sx/2, hz = sz/2;
    const rot = (dx, dz) => [cx + dx*c - dz*s, cz + dx*s + dz*c];
    const base = [rot(-hx, -hz), rot(hx, -hz), rot(hx, hz), rot(-hx, hz)];
    for (let i = 0; i < 4; i++) {
        const a = base[i], b = base[(i+1)%4];
        drawLine3D(ctx, [a[0], 0, a[1]], [b[0], 0, b[1]], cam, color, lw);
        drawLine3D(ctx, [a[0], 0, a[1]], [a[0], h, a[1]], cam, color, lw);
        drawLine3D(ctx, [a[0], h, a[1]], [b[0], h, b[1]], cam, color, lw);
    }
}

function drawPyramid3D(ctx, cx, cz, s, h, yaw, cam, color, lw) {
    const c = Math.cos(yaw), si = Math.sin(yaw);
    const rot = (dx, dz) => [cx + dx*c - dz*si, cz + dx*si + dz*c];
    const hs = s/2;
    const base = [rot(-hs, -hs), rot(hs, -hs), rot(hs, hs), rot(-hs, hs)];
    const apex = [cx, h, cz];
    for (let i = 0; i < 4; i++) {
        const a = base[i], b = base[(i+1)%4];
        drawLine3D(ctx, [a[0], 0, a[1]], [b[0], 0, b[1]], cam, color, lw);
        drawLine3D(ctx, [a[0], 0, a[1]], apex, cam, color, lw);
    }
}

function drawTankBody3D(ctx, cx, cz, sx, sz, h, yaw, cam, color, lw) {
    drawBox3D(ctx, cx, cz, sx, sz, h, yaw, cam, color, lw);
    drawBox3D(ctx, cx, cz, sx*0.5, sz*0.5, h*1.7, yaw, cam, color, lw*0.9);
    const c = Math.cos(yaw), s = Math.sin(yaw);
    const front = [cx + s * sz * 1.6, h*1.7, cz + c * sz * 1.6];
    const back  = [cx, h*1.7, cz];
    drawLine3D(ctx, back, front, cam, color, lw*1.2);
}

function generateMountains() {
    state.mountains = [];
    const count = 36;
    for (let i = 0; i < count; i++) {
        const baseAngle = (i / count) * Math.PI * 2;
        const peaks = [];
        const n = 3 + Math.floor(Math.random() * 2);
        for (let j = 0; j < n; j++) peaks.push(0.4 + Math.random() * 0.8);
        state.mountains.push({ angle: baseAngle, peaks });
    }
}

function generateObstacles() {
    state.obstacles = [];
    const numObstacles = 14;
    let attempts = 0;
    while (state.obstacles.length < numObstacles && attempts < 200) {
        attempts++;
        const angle = Math.random() * Math.PI * 2;
        const dist = 35 + Math.random() * 200;
        const x = Math.cos(angle) * dist;
        const z = Math.sin(angle) * dist;
        const shape = Math.random() < 0.5 ? 'pyramid' : 'box';
        const size = 6 + Math.random() * 8;
        const height = shape === 'pyramid' ? 8 + Math.random() * 12 : 6 + Math.random() * 10;
        const radius = size * 0.85;

        let overlap = false;
        for (let ob of state.obstacles) {
            if (checkCircleCollision(x, z, radius + 10, ob.x, ob.z, ob.radius)) {
                overlap = true;
                break;
            }
        }

        if (!overlap) {
            state.obstacles.push({
                x, z, shape, size, height, sx: size, sz: size, radius,
                yaw: Math.random() * Math.PI * 2
            });
        }
    }
}

function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * 80;
    const r = Math.random();
    const type = r < 0.2 ? 'supertank' : (r < 0.4 ? 'missile' : 'tank');
    const speed = type === 'supertank' ? 7 : (type === 'missile' ? 12 : 6);
    const hp = type === 'supertank' ? 2 : 1;
    state.enemies.push({
        x: state.player.x + Math.cos(angle) * dist,
        z: state.player.z + Math.sin(angle) * dist,
        angle: Math.random() * Math.PI * 2,
        type, speed, hp,
        radius: type === 'supertank' ? 5 : 4,
        shootTimer: 1.5 + Math.random() * 2,
        alive: true,
    });
}

function checkCircleCollision(x1, z1, r1, x2, z2, r2) {
    const dx = x2 - x1;
    const dz = z2 - z1;
    return (dx * dx + dz * dz) < (r1 + r2) * (r1 + r2);
}

function triggerExplosion(x, y, z, count = 22) {
    for (let i = 0; i < count; i++) {
        const speed = 12 + Math.random() * 28;
        const theta = Math.random() * Math.PI * 2;
        const phi = (Math.random() - 0.3) * Math.PI;
        state.particles.push({
            x, y, z,
            vx: Math.cos(phi) * Math.sin(theta) * speed,
            vy: Math.sin(phi) * speed,
            vz: Math.cos(phi) * Math.cos(theta) * speed,
            life: 0.6 + Math.random() * 0.6,
            maxLife: 1.2
        });
    }
}

const keys = { left:false, right:false, forward:false, fire:false };

function setupButton(id, key) {
    const btn = document.getElementById(id);
    if (!btn) return;
    const on = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('active'); };
    const off = (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('active'); };
    btn.addEventListener('touchstart', on, {passive:false});
    btn.addEventListener('touchend', off, {passive:false});
    btn.addEventListener('touchcancel', off, {passive:false});
    btn.addEventListener('mousedown', on);
    btn.addEventListener('mouseup', off);
    btn.addEventListener('mouseleave', off);
}

function syncUIWithConfig() {
    document.getElementById('soundToggle').checked = config.sound;
    document.getElementById('diffSelect').value = config.difficulty;
    document.getElementById('livesRange').value = config.lives;
    document.getElementById('livesVal').textContent = config.lives;
    document.getElementById('godModeToggle').checked = config.godMode;
}

function setupControls() {
    setupButton('btnLeft', 'left');
    setupButton('btnRight', 'right');
    setupButton('btnForward', 'forward');
    setupButton('btnFire', 'fire');

    document.getElementById('btnStartGame').addEventListener('click', () => {
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('start-overlay').classList.add('hidden');
        startGame();
    });

    document.getElementById('btnSettings').addEventListener('click', () => {
        syncUIWithConfig();
        document.getElementById('settings-panel').classList.add('visible');
    });

    document.getElementById('settingsClose').addEventListener('click', () => {
        config.sound = document.getElementById('soundToggle').checked;
        config.difficulty = document.getElementById('diffSelect').value;
        config.lives = parseInt(document.getElementById('livesRange').value);
        config.godMode = document.getElementById('godModeToggle').checked;
        saveConfig();
        document.getElementById('settings-panel').classList.remove('visible');
    });

    document.getElementById('livesRange').addEventListener('input', (e) => {
        document.getElementById('livesVal').textContent = e.target.value;
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowUp') keys.forward = true;
        if (e.key === ' ') { keys.fire = true; e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'ArrowUp') keys.forward = false;
        if (e.key === ' ') keys.fire = false;
    });
}

function startGame() {
    state.running = true;
    state.score = 0;
    state.lives = config.lives;
    state.level = 1;
    state.levelKills = 0;
    state.enemies = [];
    state.bullets = [];
    state.enemyBullets = [];
    state.particles = [];
    state.player = { x: 0, z: 0, angle: 0, speed: 0, radius: 4 };
    state.hitFlash = 0;
    state.enemySpawnTimer = diffSettings[config.difficulty].spawnInterval;
    generateObstacles();
    updateHUD();
    spawnEnemy();
}

function updateHUD() {
    document.getElementById('scoreDisplay').textContent = state.score;
    document.getElementById('livesDisplay').textContent = config.godMode ? '∞' : state.lives;
    document.getElementById('levelDisplay').textContent = state.level;
    document.getElementById('killsDisplay').textContent = `${state.levelKills}/${diffSettings[config.difficulty].killsForLevel}`;
}

function update(dt) {
    if (!state.running) return;

    const p = state.player;
    const turnSpeed = 2.4;
    const maxSpeed = 24;

    if (keys.left)  p.angle -= turnSpeed * dt;
    if (keys.right) p.angle += turnSpeed * dt;

    let targetSpeed = keys.forward ? maxSpeed : 0;
    p.speed += (targetSpeed - p.speed) * 6 * dt;

    updateEngineSound();

    const nextX = p.x + Math.sin(p.angle) * p.speed * dt;
    const nextZ = p.z - Math.cos(p.angle) * p.speed * dt;

    let collideX = false, collideZ = false;
    state.obstacles.forEach(ob => {
        if (checkCircleCollision(nextX, p.z, p.radius, ob.x, ob.z, ob.radius)) collideX = true;
        if (checkCircleCollision(p.x, nextZ, p.radius, ob.x, ob.z, ob.radius)) collideZ = true;
    });

    if (!collideX) p.x = nextX;
    if (!collideZ) p.z = nextZ;

    p.x = Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, p.x));
    p.z = Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, p.z));

    if (keys.fire) { keys.fire = false; fireBullet(); }

    state.bullets = state.bullets.filter(b => {
        b.x += Math.sin(b.angle) * 95 * dt;
        b.z -= Math.cos(b.angle) * 95 * dt;
        b.life -= dt;
        for (let ob of state.obstacles) {
            if (checkCircleCollision(b.x, b.z, 0.5, ob.x, ob.z, ob.radius)) return false;
        }
        return b.life > 0;
    });

    state.enemyBullets = state.enemyBullets.filter(b => {
        b.x += Math.sin(b.angle) * 55 * dt;
        b.z -= Math.cos(b.angle) * 55 * dt;
        b.life -= dt;
        for (let ob of state.obstacles) {
            if (checkCircleCollision(b.x, b.z, 0.5, ob.x, ob.z, ob.radius)) return false;
        }
        if (checkCircleCollision(b.x, b.z, 0.5, p.x, p.z, p.radius)) { onPlayerHit(); return false; }
        return b.life > 0;
    });

    state.enemies.forEach(e => {
        if (!e.alive) return;
        const dx = p.x - e.x, dz = p.z - e.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        const targetAngle = Math.atan2(dx, -dz);
        let angleDiff = targetAngle - e.angle;
        while (angleDiff >  Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        e.angle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), 2 * dt);

        let approach = dist < 25 ? -0.5 : 1;
        const eNextX = e.x + Math.sin(e.angle) * e.speed * approach * dt;
        const eNextZ = e.z - Math.cos(e.angle) * e.speed * approach * dt;

        let eCollide = false;
        state.obstacles.forEach(ob => {
            if (checkCircleCollision(eNextX, eNextZ, e.radius, ob.x, ob.z, ob.radius)) eCollide = true;
        });
        if (!eCollide) { e.x = eNextX; e.z = eNextZ; }

        e.shootTimer -= dt;
        if (e.shootTimer <= 0 && dist < 110) {
            e.shootTimer = 1.8 + Math.random() * 1.8;
            state.enemyBullets.push({ x: e.x, z: e.z, angle: e.angle, life: 2.5 });
            playTone(220, 0.1, 'sawtooth', 0.08);
        }
        if (dist < (e.radius + p.radius)) onPlayerHit();
    });

    for (let i = state.bullets.length - 1; i >= 0; i--) {
        const b = state.bullets[i];
        for (let e of state.enemies) {
            if (!e.alive) continue;
            if (checkCircleCollision(b.x, b.z, 0.5, e.x, e.z, e.radius)) {
                b.life = 0; e.hp--;
                if (e.hp <= 0) {
                    e.alive = false;
                    state.score += e.type === 'supertank' ? 3000 : (e.type === 'missile' ? 2000 : 1000);
                    state.levelKills++;
                    triggerExplosion(e.x, 3, e.z);
                    playExplosion();

                    const targetKills = diffSettings[config.difficulty].killsForLevel;
                    if (state.levelKills >= targetKills) {
                        state.level++;
                        state.levelKills = 0;
                    }
                    updateHUD();
                }
                break;
            }
        }
    }
    state.bullets = state.bullets.filter(b => b.life > 0);
    state.enemies = state.enemies.filter(e => e.alive);

    state.particles = state.particles.filter(pt => {
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.z += pt.vz * dt;
        pt.vy -= 18 * dt; // Gravedad
        pt.life -= dt;
        return pt.life > 0 && pt.y >= 0;
    });

    state.enemySpawnTimer -= dt;
    if (state.enemySpawnTimer <= 0) {
        spawnEnemy();
        state.enemySpawnTimer = diffSettings[config.difficulty].spawnInterval;
    }

    if (state.hitFlash > 0) state.hitFlash -= dt;
}

function fireBullet() {
    const p = state.player;
    state.bullets.push({
        x: p.x + Math.sin(p.angle) * 4,
        z: p.z - Math.cos(p.angle) * 4,
        angle: p.angle,
        life: 1.5
    });
    playFire();
}

function onPlayerHit() {
    if (config.godMode || state.hitFlash > 0) return;
    state.hitFlash = 0.6;
    playHit();
    state.lives--;
    updateHUD();
    if (state.lives <= 0) {
        state.running = false;
        document.getElementById('overlayText').style.display = 'block';
        document.getElementById('btnStartGame').textContent = 'REINICIAR';
        document.getElementById('start-overlay').classList.remove('hidden');
    } else {
        state.player.x = (Math.random() - 0.5) * 60;
        state.player.z = (Math.random() - 0.5) * 60;
    }
}

function drawMountains(ctx, camAngle) {
    const mountains = state.mountains;
    if (!mountains.length) return;

    ctx.strokeStyle = '#00aa44';
    ctx.lineWidth = 1.2;
    ctx.beginPath();

    const halfW = (CANVAS_W / 2) / Math.tan((FOV/2) * Math.PI/180);
    let started = false;

    for (let i = 0; i < mountains.length; i++) {
        const m = mountains[i];
        let rel = m.angle - camAngle;
        while (rel >  Math.PI) rel -= Math.PI * 2;
        while (rel < -Math.PI) rel += Math.PI * 2;
        if (Math.abs(rel) > Math.PI * 0.55) { started = false; continue; }

        const baseX = CANVAS_W / 2 + Math.tan(rel) * halfW;
        for (let j = 0; j < m.peaks.length; j++) {
            const h = m.peaks[j] * 45;
            const px = baseX + (j - m.peaks.length/2) * 12;
            const py = HORIZON_Y - h;
            if (!started) { ctx.moveTo(px, py); started = true; }
            else ctx.lineTo(px, py);
        }
    }
    ctx.stroke();
}

function render(ctx) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    const p = state.player;
    const cam = { x: p.x, y: EYE_HEIGHT, z: p.z, a: p.angle };

    drawMountains(ctx, p.angle);

    ctx.strokeStyle = '#008800';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, HORIZON_Y);
    ctx.lineTo(CANVAS_W, HORIZON_Y);
    ctx.stroke();

    const gridSize = 25;
    const range = 130;
    const startX = Math.floor((p.x - range) / gridSize) * gridSize;
    const endX = p.x + range;
    const startZ = Math.floor((p.z - range) / gridSize) * gridSize;
    const endZ = p.z + range;
    for (let gx = startX; gx <= endX; gx += gridSize) {
        drawLine3D(ctx, [gx, 0, startZ], [gx, 0, endZ], cam, '#003300', 0.5);
    }
    for (let gz = startZ; gz <= endZ; gz += gridSize) {
        drawLine3D(ctx, [startX, 0, gz], [endX, 0, gz], cam, '#003300', 0.5);
    }

    state.obstacles.forEach(ob => {
        if (ob.shape === 'pyramid') {
            drawPyramid3D(ctx, ob.x, ob.z, ob.size, ob.height, ob.yaw, cam, '#00aa00', 1);
        } else {
            drawBox3D(ctx, ob.x, ob.z, ob.sx, ob.sz, ob.height, ob.yaw, cam, '#00aa00', 1);
        }
    });

    state.enemies.forEach(e => {
        let color = e.type === 'supertank' ? '#ff8800' : (e.type === 'missile' ? '#ff0000' : '#ff4444');
        drawTankBody3D(ctx, e.x, e.z, 7, 7, 4, e.angle, cam, color, 1.2);
    });

    state.particles.forEach(pt => {
        const p3d = project3D(pt.x, pt.y, pt.z, cam.x, cam.y, cam.z, cam.a);
        if (p3d) {
            const alpha = pt.life / pt.maxLife;
            ctx.fillStyle = `rgba(255, ${Math.floor(180 * alpha)}, 0, ${alpha})`;
            const sz = Math.max(1, p3d.scale * 0.4);
            ctx.fillRect(p3d.x - sz/2, p3d.y - sz/2, sz, sz);
        }
    });

    state.bullets.forEach(b => {
        const pt = project3D(b.x, EYE_HEIGHT * 0.5, b.z, cam.x, cam.y, cam.z, cam.a);
        if (pt) {
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, Math.max(1.5, pt.scale * 0.6), 0, Math.PI*2);
            ctx.fill();
        }
    });

    state.enemyBullets.forEach(b => {
        const pt = project3D(b.x, 3, b.z, cam.x, cam.y, cam.z, cam.a);
        if (pt) {
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, Math.max(1.5, pt.scale * 0.7), 0, Math.PI*2);
            ctx.fill();
        }
    });

    // Visor blanco
    const centerX = CANVAS_W / 2;
    const centerY = CANVAS_H / 2;

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(centerX - 13, centerY); ctx.lineTo(centerX - 4, centerY);
    ctx.moveTo(centerX + 4, centerY);  ctx.lineTo(centerX + 13, centerY);
    ctx.moveTo(centerX, centerY - 13); ctx.lineTo(centerX, centerY - 4);
    ctx.moveTo(centerX, centerY + 4);  ctx.lineTo(centerX, centerY + 13);
    ctx.stroke();

    if (state.hitFlash > 0) {
        ctx.fillStyle = `rgba(255,0,0,${state.hitFlash * 0.5})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }
}

function renderRadar() {
    const rCanvas = document.getElementById('radarCanvas');
    const rCtx = rCanvas.getContext('2d');
    const w = rCanvas.width, h = rCanvas.height;
    rCtx.clearRect(0, 0, w, h);
    rCtx.fillStyle = '#001100';
    rCtx.beginPath(); rCtx.arc(w/2, h/2, w/2 - 1, 0, Math.PI*2); rCtx.fill();
    
    const p = state.player;
    rCtx.strokeStyle = '#00ff00';
    rCtx.lineWidth = 1.5;
    rCtx.beginPath();
    rCtx.moveTo(w/2, h/2);
    const sweepAngle = -Math.PI/2 - p.angle;
    rCtx.lineTo(w/2 + Math.cos(sweepAngle) * w/2, h/2 + Math.sin(sweepAngle) * w/2);
    rCtx.stroke();

    state.enemies.forEach(e => {
        const dx = e.x - p.x, dz = e.z - p.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if (dist > 180) return;
        const relAngle = Math.atan2(dx, -dz) - p.angle;
        const r = (dist / 180) * (w/2 - 4);
        const ex = w/2 + Math.sin(relAngle) * r;
        const ey = h/2 - Math.cos(relAngle) * r;
        rCtx.fillStyle = '#ff4444';
        rCtx.beginPath(); rCtx.arc(ex, ey, 2.5, 0, Math.PI*2); rCtx.fill();
    });
}

let gameCtx = null;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - state.lastTime) / 1000, 0.05);
    state.lastTime = timestamp;
    update(dt);
    if (gameCtx) {
        render(gameCtx);
        renderRadar();
    }
    requestAnimationFrame(gameLoop);
}

function init() {
    loadConfig();
    const canvas = document.getElementById('gameCanvas');
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
    gameCtx = canvas.getContext('2d');
    setupControls();
    generateMountains();
    generateObstacles();
    updateHUD();
    state.lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

init();
})();
</script>
</body>
