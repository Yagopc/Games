<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- ============================================================ -->
    <!--  CONFIGURACIÓN: cambia SOLO estas dos líneas                  -->
    <!-- ============================================================ -->
    <script>
        window.FOLDER_NAME = 'Games';                      // nombre de la carpeta
        window.SERVER_HOST = 'https://yagopc.github.io';      // host del servidor
    </script>
    <!-- ============================================================ -->

    <script>
        (function () {
            const base = `${window.SERVER_HOST}/${window.FOLDER_NAME}`;
            const name = window.FOLDER_NAME;

            const addLink = (rel, href) => {
                const l = document.createElement('link');
                l.rel = rel;
                l.href = href;
                document.head.appendChild(l);
            };
            addLink('icon',            `${base}/${name}.png`);
            addLink('apple-touch-icon',`${base}/${name}.png`);

            const pretty = name.charAt(0).toUpperCase() + name.slice(1);
            document.title = pretty;
            document.addEventListener('DOMContentLoaded', () => {
                const h1 = document.querySelector('.header h1');
                if (h1) h1.textContent = pretty;
            });
        })();
    </script>

    <!-- Configuración para Web App (PWA) ligera -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Menú</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }

        .header h1 { font-size: 1.4em; }

        .server-info {
            background: #f8f9fa;
            padding: 10px 15px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
        }

        .status-text { color: #666; }
        .content { padding: 10px; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
        }

        .game-card {
            background: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #ddd;
            transition: transform 0.1s ease;
        }

        .game-card:active {
            transform: scale(0.95);
            background: #e2e8f0;
        }

        .game-cover-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .game-cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .default-icon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 4px;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            color: #333;
        }

        .default-icon { font-size: 1.8em; }

        .game-info {
            width: 100%;
            padding: 6px 4px;
            background: #ffffff;
            border-top: 1px solid #edf2f7;
            text-align: center;
        }

        .game-filename-text {
            font-weight: 600;
            font-size: 0.7em;
            color: #2d3748;
            word-break: break-all;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .game-card.missing {
            border-color: #c33;
            opacity: 0.45;
        }

        .banner {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            color: white;
            font-size: 0.9em;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            z-index: 1000;
            display: none;
        }
        .banner.show { display: block; }
        .banner.ok { background: #2f855a; }
        .banner.error { background: #c53030; }

        footer {
            background: #f8f9fa;
            padding: 10px;
            text-align: center;
            color: #666;
            font-size: 0.75em;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Menú</h1>
        </div>

        <div class="server-info">
            <span class="status-text">Cargando...</span>
            <button class="refresh-btn" onclick="loadFiles(true)">
                🔄 Actualizar
            </button>
        </div>

        <div class="content" id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando games...</p>
            </div>
        </div>

        <footer id="footer"></footer>
    </div>

    <div id="banner" class="banner"></div>

    <script>
        // Derivadas de la configuración superior (no tocar)
        const FOLDER_NAME   = window.FOLDER_NAME;
        const SERVER_HOST   = window.SERVER_HOST;
        const SERVER_URL    = `${SERVER_HOST}/${FOLDER_NAME}`;
        const MENU_FILENAME = `${FOLDER_NAME}.html`;

        document.getElementById('footer').textContent = `Servidor: ${SERVER_URL}`;

        // ---------------- Memoria residente (localStorage) ----------------
        // La lista de programas (y sus portadas) se guarda la primera vez y se reutiliza
        // en cada apertura. Solo se vuelve a leer el directorio al pulsar "Actualizar".
        const CACHE_KEY = `menu_cache::${SERVER_URL}`;

        function readCache() {
            try {
                const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
                if (c && Array.isArray(c.files) && c.files.length > 0) return c;
            } catch (e) { /* sin memoria disponible */ }
            return null;
        }

        function writeCache(files) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ files, date: Date.now() }));
            } catch (e) { console.warn('No se pudo guardar en memoria', e); }
        }

        function clearCache() {
            try { localStorage.removeItem(CACHE_KEY); } catch (e) { /* nada */ }
        }

        function fmtDate(ts) {
            try {
                return new Date(ts).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
            } catch (e) { return new Date(ts).toLocaleString(); }
        }

        // ---------------- Aviso flotante ----------------
        let bannerTimer = null;
        function showBanner(msg, kind, ms) {
            const b = document.getElementById('banner');
            b.textContent = msg;
            b.className = 'banner show ' + (kind || 'ok');
            clearTimeout(bannerTimer);
            bannerTimer = setTimeout(() => { b.className = 'banner'; }, ms || 4000);
        }

        // ---------------- Carga de la lista ----------------
        // force = false: si hay lista en memoria se usa tal cual, sin tocar el servidor.
        // force = true : (botón Actualizar) vuelve a leer el directorio y sustituye la memoria.
        async function loadFiles(force = false) {
            const contentDiv = document.getElementById('content');
            const statusText = document.querySelector('.status-text');

            if (!force) {
                const cache = readCache();
                if (cache) {
                    renderGrid(cache.files);
                    statusText.textContent =
                        `${cache.files.length} programa(s) · guardado ${fmtDate(cache.date)}`;
                    return;
                }
            }

            contentDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Buscando games...</p>
                </div>
            `;
            statusText.textContent = 'Conectando...';

            try {
                const names = await fetchFileList();

                if (names.length === 0) {
                    clearCache();
                    contentDiv.innerHTML = `
                        <div class="loading">
                            📭 No se encontraron games(.html)
                            <br><br>
                            <button class="refresh-btn" onclick="loadFiles(true)">Reintentar</button>
                        </div>
                    `;
                    statusText.textContent = 'Sin games';
                    return;
                }

                const files = await resolveCovers(names);
                writeCache(files);
                renderGrid(files);
                statusText.textContent =
                    `${files.length} programa(s) · actualizado ${fmtDate(Date.now())}`;
                if (force) showBanner('✅ Directorio actualizado', 'ok');

            } catch (error) {
                console.error('Error:', error);
                const cache = readCache();
                if (cache) {
                    // Falló la lectura: se conserva lo que ya había en memoria.
                    renderGrid(cache.files);
                    statusText.textContent = 'Sin conexión · lista guardada';
                    showBanner('❌ No se pudo conectar con el servidor. Se mantiene la lista guardada.',
                        'error', 6000);
                } else {
                    contentDiv.innerHTML = `
                        <div class="error-message">
                            <strong>❌ Error de conexión</strong><br>
                            No se pudo conectar con el servidor.
                            <br><br>
                            <button class="refresh-btn" onclick="loadFiles(true)">Reintentar</button>
                        </div>
                    `;
                    statusText.textContent = 'Error';
                }
            }
        }

        async function fetchFileList() {
            const response = await fetch(SERVER_URL + '/', {
                method: 'GET',
                mode: 'cors',
                cache: 'no-store',
                headers: { 'Accept': 'text/html' }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const htmlText = await response.text();
            return parseDirectoryListing(htmlText);
        }

        function parseDirectoryListing(htmlText) {
            const files = [];
            const linkRegex = /href="([^"]*\.html?)"/gi;
            let match;

            while ((match = linkRegex.exec(htmlText)) !== null) {
                let fileName;
                try { fileName = decodeURIComponent(match[1]); }
                catch (e) { fileName = match[1]; }
                if (fileName &&
                    fileName !== MENU_FILENAME &&
                    fileName !== 'index.html' &&
                    !fileName.startsWith('.') &&
                    !files.includes(fileName)) {
                    files.push(fileName);
                }
            }
            return files;
        }

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // Busca la portada (.jpg o .png) de cada programa; se guarda en memoria con la lista.
        async function resolveCovers(names) {
            return Promise.all(names.map(async (name) => {
                const baseName = name.substring(0, name.lastIndexOf('.'));
                let img = null;
                for (const ext of ['jpg', 'png']) {
                    const u = `${SERVER_URL}/${encodeURIComponent(baseName)}.${ext}`;
                    if (await checkImageExists(u)) { img = u; break; }
                }
                return { name, img };
            }));
        }

        // ---------------- Pintar la cuadrícula ----------------
        function renderGrid(files) {
            const contentDiv = document.getElementById('content');
            const gridContainer = document.createElement('div');
            gridContainer.className = 'games-grid';

            for (const file of files) {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openProgram(file.name, card);

                const coverWrapper = document.createElement('div');
                coverWrapper.className = 'game-cover-wrapper';

                if (file.img) {
                    coverWrapper.innerHTML = `<img src="${file.img}" alt="${escapeHtml(file.name)}">`;
                } else {
                    coverWrapper.innerHTML = `
                        <div class="default-icon-container">
                            <span class="default-icon">🎮</span>
                        </div>
                    `;
                }

                const infoBox = document.createElement('div');
                infoBox.className = 'game-info';
                infoBox.innerHTML = `<span class="game-filename-text">${escapeHtml(file.name)}</span>`;

                card.appendChild(coverWrapper);
                card.appendChild(infoBox);
                gridContainer.appendChild(card);
            }

            contentDiv.innerHTML = '';
            contentDiv.appendChild(gridContainer);
        }

        // ---------------- Abrir un programa ----------------
        // Antes de abrirlo comprueba que el archivo sigue existiendo en el servidor.
        async function openProgram(name, card) {
            const url = `${SERVER_URL}/${encodeURIComponent(name)}`;

            try {
                const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
                if (r.status === 404 || r.status === 410) {
                    card.classList.add('missing');
                    showBanner(`❌ «${name}» ya no existe en el directorio. ` +
                        `Pulsa 🔄 Actualizar para refrescar la lista.`, 'error', 8000);
                    return;
                }
            } catch (e) {
                // No se pudo comprobar (servidor caído o sin CORS): se intenta abrir igualmente.
            }

            const w = window.open(url, '_blank');
            if (!w) location.href = url;   // ventana emergente bloqueada
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadFiles(false);
        });
    </script>
</body>
</html>
