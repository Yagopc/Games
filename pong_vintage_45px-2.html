<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PONG VINTAGE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:monospace;touch-action:none}
body{display:flex;flex-direction:column}
#topBar{height:48px;min-height:48px;display:flex;align-items:center;padding-left:12px;background:#000;border-bottom:2px solid #fff;font-size:16px;font-weight:bold;letter-spacing:1px}
#gameArea{position:relative;flex:1;width:100%;overflow:hidden;background:#000}
#gameCanvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.9);z-index:20;text-align:center}
.overlay.hidden{display:none}
.title{font-size:clamp(30px,10vw,60px);font-weight:bold;letter-spacing:5px;margin-bottom:15px}
.subtitle{font-size:14px;margin-bottom:30px}
button{background:#000;color:#fff;border:2px solid #fff;padding:12px 30px;font-family:monospace;font-size:18px;font-weight:bold;border-radius:0;cursor:pointer}
button:active{background:#fff;color:#000}
#goalMessage{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:10;font-size:clamp(24px,8vw,48px);font-weight:bold;display:none;text-align:center;white-space:nowrap}
#bottomBar{height:38px;min-height:38px;border-top:2px solid #fff;background:#000;display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:bold}
#bottomInfo{display:flex;width:100%;justify-content:space-between}
#pauseText{font-size:30px;margin-bottom:20px}
</style>
</head>
<body>
<div id="topBar"><div>TANTOS: <span id="scoreValue">0</span>&nbsp;&nbsp;-&nbsp;&nbsp;MARCA: 5</div></div>
<div id="gameArea">
<canvas id="gameCanvas"></canvas>
<div id="goalMessage">¡TANTO!</div>
<div id="startScreen" class="overlay">
<div class="title">PONG</div>
<div class="subtitle">MUEVE LA BARRA CON EL DEDO</div>
<div style="display:flex;gap:10px;justify-content:center;align-items:center;">
<button type="button" id="startButton">JUGAR</button>
<button type="button" id="configButton">CONFIG.</button>
</div>
</div>
<div id="configScreen" class="overlay hidden">
<div class="title" style="font-size:28px;letter-spacing:3px;">CONFIGURACIÓN</div>
<div style="width:min(82vw,360px);text-align:left;font-size:16px;line-height:1.8;">
<label for="speedInput">Velocidad: <strong><span id="speedDisplay">5</span></strong></label>
<input id="speedInput" type="range" min="1" max="10" step="1" value="5" style="width:100%;display:block;">

<label for="ballsInput">Bolas en juego: <strong><span id="ballsDisplay">1</span></strong></label>
<input id="ballsInput" type="range" min="1" max="5" step="1" value="1" style="width:100%;display:block;">

<label for="paddleWidthInput">Ancho de barra: <strong><span id="paddleWidthDisplay">8</span></strong></label>
<input id="paddleWidthInput" type="range" min="3" max="20" step="1" value="8" style="width:100%;display:block;">
<div style="font-size:11px;color:#888;margin-top:-5px;">3 = estrecha, 20 = muy ancha</div>
</div>
<div style="font-size:12px;margin:12px 0 20px;max-width:320px;">
Los valores se aplicarán al pulsar JUGAR.
</div>
<div style="display:flex;gap:10px;">
<button type="button" id="saveConfigButton">GUARDAR</button>
<button type="button" id="cancelConfigButton">CANCELAR</button>
</div>
</div>
<div id="pauseScreen" class="overlay hidden"><div id="pauseText">PAUSA</div><button id="resumeButton">CONTINUAR</button></div>
<div id="gameOverScreen" class="overlay hidden"><div class="title">FIN</div><div class="subtitle" id="finalText">PARTIDA TERMINADA</div><button id="restartButton">OTRA PARTIDA</button></div>
</div>
<div id="bottomBar"><div id="bottomInfo"><span>◀ PONG ▶</span><span>REBOTES: <span id="reboundValue">0</span></span></div></div>

<script>
const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d"),gameArea=document.getElementById("gameArea");
const scoreValue=document.getElementById("scoreValue"),reboundValue=document.getElementById("reboundValue");
const startScreen=document.getElementById("startScreen"),pauseScreen=document.getElementById("pauseScreen"),gameOverScreen=document.getElementById("gameOverScreen");
const goalMessage=document.getElementById("goalMessage"),finalText=document.getElementById("finalText");
const startButton=document.getElementById("startButton"),resumeButton=document.getElementById("resumeButton"),restartButton=document.getElementById("restartButton");
const configButton=document.getElementById("configButton"),configScreen=document.getElementById("configScreen"),saveConfigButton=document.getElementById("saveConfigButton");
const cancelConfigButton=document.getElementById("cancelConfigButton");
const speedInput=document.getElementById("speedInput"),ballsInput=document.getElementById("ballsInput");
const paddleWidthInput=document.getElementById("paddleWidthInput");
const speedDisplay=document.getElementById("speedDisplay"),ballsDisplay=document.getElementById("ballsDisplay");
const paddleWidthDisplay=document.getElementById("paddleWidthDisplay");
let W=0,H=0,running=false,paused=false,gameOver=false,score=0,rebounds=0;
let selectedSpeed=5;
let selectedBalls=1;
let selectedPaddleWidth=8; // 1/8 por defecto
const maxScore=5;
const CONFIG={paddleHeight:12,paddleBottomDistance:45,initialSpeed:5,speedIncrease:.10,maxSpeed:10,border:3};
const paddle={x:0,y:0,width:0,height:CONFIG.paddleHeight,targetX:0};
const ball={x:0,y:0,radius:7,vx:0,vy:0,speed:0};
let balls=[];

function resizeCanvas(){
 const rect=gameArea.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
 W=rect.width;H=rect.height;canvas.width=W*dpr;canvas.height=H*dpr;
 canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);
 paddle.width=W/selectedPaddleWidth;
 paddle.y=H-CONFIG.paddleBottomDistance-paddle.height;
 if(!running){paddle.x=(W-paddle.width)/2;paddle.targetX=paddle.x;}
}
window.addEventListener("resize",resizeCanvas);

let audioContext=null;
function initAudio(){
 if(!audioContext){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioContext=new AC();}
 if(audioContext&&audioContext.state==="suspended")audioContext.resume();
}
function beep(frequency,duration,volume){
 if(!audioContext)return;
 const o=audioContext.createOscillator(),g=audioContext.createGain();
 o.type="square";o.frequency.value=frequency;
 g.gain.setValueAtTime(volume,audioContext.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
 o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+duration);
}
function soundPaddle(){beep(500,.045,.08)}
function soundWall(){beep(750,.035,.06)}
function soundGoal(){beep(180,.18,.12);setTimeout(()=>beep(100,.20,.10),100)}
function soundGameOver(){beep(150,.25,.12);setTimeout(()=>beep(100,.35,.10),200)}
function vibrate(ms){if(navigator.vibrate)navigator.vibrate(ms)}

function createBall(){
 ball.x=W/2;ball.y=H*.45;ball.radius=Math.max(5,Math.min(8,W*.018));ball.speed=selectedSpeed;
 const angle=Math.random()*.9-.45;
 ball.vx=Math.sin(angle)*ball.speed;ball.vy=Math.cos(angle)*ball.speed;
}
function createBalls(){
 balls=[];
 for(let i=0;i<selectedBalls;i++){
  createBall();
  balls.push({x:ball.x,y:ball.y,radius:ball.radius,vx:ball.vx,vy:ball.vy,speed:ball.speed});
 }
}
function loadBall(b){
 ball.x=b.x;ball.y=b.y;ball.radius=b.radius;ball.vx=b.vx;ball.vy=b.vy;ball.speed=b.speed;
}
function saveBall(b){
 b.x=ball.x;b.y=ball.y;b.radius=ball.radius;b.vx=ball.vx;b.vy=ball.vy;b.speed=ball.speed;
}

function newGame(){
 score=0;rebounds=0;scoreValue.textContent=score;reboundValue.textContent=rebounds;
 gameOver=false;paused=false;running=true;
 paddle.width=W/selectedPaddleWidth;
 paddle.y=H-CONFIG.paddleBottomDistance-paddle.height;
 paddle.x=(W-paddle.width)/2;paddle.targetX=paddle.x;createBalls();
 startScreen.classList.add("hidden");configScreen.classList.add("hidden");pauseScreen.classList.add("hidden");gameOverScreen.classList.add("hidden");goalMessage.style.display="none";
 initAudio();requestAnimationFrame(gameLoop);
}
function goal(){
 if(!running||gameOver)return;
 score++;scoreValue.textContent=score;soundGoal();vibrate(100);goalMessage.style.display="block";
 if(score>=maxScore){
  running=false;gameOver=true;
  setTimeout(()=>{goalMessage.style.display="none";finalText.textContent="HAS CONSEGUIDO "+score+" TANTOS";gameOverScreen.classList.remove("hidden");soundGameOver()},1000);
  return;
 }
 running=false;
 setTimeout(()=>{if(gameOver)return;createBalls();goalMessage.style.display="none";running=true;requestAnimationFrame(gameLoop)},1000);
}
function paddleCollision(){
 if(ball.vy<=0)return;
 const paddleTop=paddle.y,ballBottom=ball.y+ball.radius;
 if(ballBottom>=paddleTop&&ballBottom<=paddleTop+paddle.height+10&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.width){
  const hitPosition=(ball.x-(paddle.x+paddle.width/2))/(paddle.width/2);
  const normalized=Math.max(-1,Math.min(1,hitPosition));
  const maxAngle=Math.PI/4;
  const angle=normalized*maxAngle;
  ball.speed=Math.min(ball.speed+CONFIG.speedIncrease,CONFIG.maxSpeed);
  ball.vx=Math.sin(angle)*ball.speed;ball.vy=-Math.cos(angle)*ball.speed;
  ball.y=paddleTop-ball.radius-1;rebounds++;reboundValue.textContent=rebounds;soundPaddle();vibrate(15);
 }
}
function update(){
 paddle.x+=(paddle.targetX-paddle.x)*.35;
 if(paddle.x<0)paddle.x=0;
 if(paddle.x+paddle.width>W)paddle.x=W-paddle.width;

 for(let i=balls.length-1;i>=0;i--){
  const b=balls[i];
  loadBall(b);

  ball.x+=ball.vx;ball.y+=ball.vy;

  if(ball.x-ball.radius<=CONFIG.border){
   ball.x=CONFIG.border+ball.radius;ball.vx=Math.abs(ball.vx);soundWall();
  }
  if(ball.x+ball.radius>=W-CONFIG.border){
   ball.x=W-CONFIG.border-ball.radius;ball.vx=-Math.abs(ball.vx);soundWall();
  }
  if(ball.y-ball.radius<=CONFIG.border){
   ball.y=CONFIG.border+ball.radius;ball.vy=Math.abs(ball.vy);soundWall();
  }

  paddleCollision();

  if(ball.y-ball.radius>H){
   balls.splice(i,1);
  } else {
   saveBall(b);
  }
 }

 if(balls.length===0) goal();
}
function draw(){
 ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";
 ctx.fillRect(0,0,W,CONFIG.border);
 ctx.fillRect(0,0,CONFIG.border,H);
 ctx.fillRect(W-CONFIG.border,0,CONFIG.border,H);
 ctx.fillRect(paddle.x,paddle.y,paddle.width,paddle.height);

 for(const b of balls){
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
  ctx.fill();
 }

 ctx.globalAlpha=.18;
 for(let y=15;y<H-20;y+=22)ctx.fillRect(W/2-1,y,2,7);
 ctx.globalAlpha=1;
}
function gameLoop(){
 if(!running){draw();return} if(paused){draw();return}
 update();draw();requestAnimationFrame(gameLoop);
}
function movePaddle(clientX){
 const rect=canvas.getBoundingClientRect(),x=clientX-rect.left;
 paddle.targetX=x-paddle.width/2;
 if(paddle.targetX<0)paddle.targetX=0;
 if(paddle.targetX+paddle.width>W)paddle.targetX=W-paddle.width;
}
canvas.addEventListener("touchstart",e=>{e.preventDefault();if(e.touches.length)movePaddle(e.touches[0].clientX)},{passive:false});
canvas.addEventListener("touchmove",e=>{e.preventDefault();if(e.touches.length)movePaddle(e.touches[0].clientX)},{passive:false});
canvas.addEventListener("mousemove",e=>movePaddle(e.clientX));

let lastTap=0;
canvas.addEventListener("touchend",()=>{const now=Date.now();if(now-lastTap<300)togglePause();lastTap=now});
function togglePause(){
 if(!running&&!paused)return;paused=!paused;
 if(paused)pauseScreen.classList.remove("hidden");
 else{pauseScreen.classList.add("hidden");requestAnimationFrame(gameLoop)}
}
speedInput.addEventListener("input",function(){
 speedDisplay.textContent=this.value;
});
ballsInput.addEventListener("input",function(){
 ballsDisplay.textContent=this.value;
});
paddleWidthInput.addEventListener("input",function(){
 paddleWidthDisplay.textContent=this.value;
});

configButton.addEventListener("click",function(e){
 e.preventDefault();
 e.stopPropagation();
 speedInput.value=selectedSpeed;
 ballsInput.value=selectedBalls;
 paddleWidthInput.value=selectedPaddleWidth;
 speedDisplay.textContent=selectedSpeed;
 ballsDisplay.textContent=selectedBalls;
 paddleWidthDisplay.textContent=selectedPaddleWidth;
 startScreen.classList.add("hidden");
 configScreen.classList.remove("hidden");
});

saveConfigButton.addEventListener("click",function(){
 selectedSpeed=Number(speedInput.value);
 selectedBalls=Number(ballsInput.value);
 selectedPaddleWidth=Number(paddleWidthInput.value);
 configScreen.classList.add("hidden");
 startScreen.classList.remove("hidden");
});

cancelConfigButton.addEventListener("click",function(){
 configScreen.classList.add("hidden");
 startScreen.classList.remove("hidden");
});

startButton.addEventListener("click",newGame);
resumeButton.addEventListener("click",togglePause);
restartButton.addEventListener("click",function(){
 gameOverScreen.classList.add("hidden");
 newGame();
});

document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());

resizeCanvas();paddle.width=W/selectedPaddleWidth;paddle.y=H-CONFIG.paddleBottomDistance-paddle.height;
paddle.x=(W-paddle.width)/2;paddle.targetX=paddle.x;createBalls();draw();
</script>
</body>
</html>
